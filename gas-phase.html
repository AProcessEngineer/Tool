<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gas Phase Calculator - A Process Engineer's Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2e5c 0%, #0a4c6e 100%);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; color: white; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
        .header h1 span { color: #ff9800; }
        .header p { color: #b8d4f0; font-size: 1.2rem; font-weight: bold; }
        .back-btn {
            background: #ff9800; color: #1a2a3a; border: none; padding: 10px 20px;
            border-radius: 40px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
            margin-bottom: 20px; display: inline-flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { background: #e68900; }
        .calc-page { background: white; border-radius: 24px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .gas-phase-section { background: #f0f4f8; border-radius: 16px; padding: 20px; margin-bottom: 25px; border-left: 5px solid #ff9800; }
        .gas-phase-section h2 { color: #0a2e5c; margin-bottom: 15px; font-size: 1.3rem; }
        .gas-phase-section h3 { color: #0a2e5c; margin-bottom: 15px; font-size: 1rem; }
        .gas-input-row { margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .gas-input-row label { width: 140px; font-size: 0.85rem; font-weight: 500; color: #555; }
        .gas-input-row input, .gas-input-row select { flex: 1; min-width: 120px; padding: 8px 12px; border: 2px solid #ddd; border-radius: 8px; }
        .gas-input-row .blue-input { background: #e3f2fd !important; border-color: #2196f3 !important; }
        .gas-result { font-weight: bold; color: #0a2e5c; background: #e8f0fe; padding: 8px 12px; border-radius: 8px; flex: 1; text-align: center; }
        .gas-grid-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 15px; }
        hr { margin: 15px 0; border: none; border-top: 1px solid #ddd; }
        .footer-quote { text-align: center; margin-top: 30px; padding: 15px; color: #ff9800; font-style: italic; font-size: 1.1rem; }
        .copyright { text-align: center; font-size: 0.7rem; color: #888; margin-top: 10px; }
        @media (max-width: 768px) {
            .gas-grid-2col { grid-template-columns: 1fr; }
            .gas-input-row { flex-direction: column; align-items: flex-start; }
            .gas-input-row label { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <button class="back-btn" onclick="window.location.href='index.html'">← Back to Dashboard</button>
    
    <div class="calc-page">
        <div class="header" style="margin-bottom: 20px; padding: 0;">
            <h1><span>🔥</span> Gas Phase Calculator</h1>
            <p>Flowrate | Actual Volumetric Flow | Ideal Gas Law</p>
        </div>

        <!-- Section 1: Flowrate Calculations -->
        <div class="gas-phase-section">
            <h2>📊 Flowrate Calculations</h2>
            <div class="gas-grid-2col">
                <div>
                    <h3>Path A: MW + Mass Flow → Molar Flow + Vol Flow</h3>
                    <div class="gas-input-row"><label>Molecular Weight</label><input id="gp_mw_a" class="blue-input" value="28" oninput="calcPathA()"><select id="gp_mw_a_unit" onchange="calcPathA()"><option>kg/kmol</option><option>g/mol</option><option>lb/lbmol</option></select></div>
                    <div class="gas-input-row"><label>Mass Flowrate</label><input id="gp_mass_a" class="blue-input" value="2000" oninput="calcPathA()"><select id="gp_mass_a_unit" onchange="calcPathA()"><option>kg/hr</option><option>lb/hr</option><option>kg/s</option><option>lb/s</option></select></div>
                    <div class="gas-input-row"><label>→ Molar Flowrate</label><div class="gas-result" id="gp_molar_a_out"><strong>--</strong></div><select id="gp_molar_a_unit" onchange="calcPathA()"><option>kmol/hr</option><option>lbmol/hr</option><option>mole/s</option><option>mole/hr</option></select></div>
                    <div class="gas-input-row"><label>→ Volumetric Flowrate</label><div class="gas-result" id="gp_vol_a_out"><strong>--</strong></div><select id="gp_vol_a_unit" onchange="calcPathA()"><option>Nm³/hr</option><option>Sm³/hr</option><option>MMSCFD</option><option>SCFM</option><option>SCFD</option></select></div>
                </div>
                <div>
                    <h3>Path B: MW + Vol Flow → Molar Flow + Mass Flow</h3>
                    <div class="gas-input-row"><label>Molecular Weight</label><input id="gp_mw_b" class="blue-input" value="28" oninput="calcPathB()"><select id="gp_mw_b_unit" onchange="calcPathB()"><option>kg/kmol</option><option>g/mol</option><option>lb/lbmol</option></select></div>
                    <div class="gas-input-row"><label>Volumetric Flowrate</label><input id="gp_vol_b" class="blue-input" value="16007" oninput="calcPathB()"><select id="gp_vol_b_unit" onchange="calcPathB()"><option>Nm³/hr</option><option>Sm³/hr</option><option>MMSCFD</option><option>SCFM</option><option>SCFD</option></select></div>
                    <div class="gas-input-row"><label>→ Molar Flowrate</label><div class="gas-result" id="gp_molar_b_out"><strong>--</strong></div><select id="gp_molar_b_unit" onchange="calcPathB()"><option>kmol/hr</option><option>lbmol/hr</option><option>mole/s</option><option>mole/hr</option></select></div>
                    <div class="gas-input-row"><label>→ Mass Flowrate</label><div class="gas-result" id="gp_mass_b_out"><strong>--</strong></div><select id="gp_mass_b_unit" onchange="calcPathB()"><option>kg/hr</option><option>lb/hr</option><option>kg/s</option><option>lb/s</option></select></div>
                </div>
            </div>
        </div>

        <!-- Section
