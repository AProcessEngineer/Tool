<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google-site-verification" content="pLzoZiJTZLKHLwS9LkGWCiKIUB98ZtE8PqpDrAy6ASA" />
    <title>Process Engineer's Tool - Oil & Gas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2e5c 0%, #0a4c6e 100%);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; padding: 20px; }
        .header h1 { font-size: 2.5rem; color: white; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
        .header h1 span { color: #ff9800; }
        .header p { color: #b8d4f0; font-size: 1.1rem; margin-top: 10px; }
        .footer-quote { text-align: center; margin-top: 50px; padding: 20px; border-top: 1px solid rgba(255,255,255,0.2); color: #ff9800; font-style: italic; }
        .copyright { text-align: center; font-size: 0.7rem; color: #888; margin-top: 10px; padding: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .tool-card {
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 28px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .tool-card:hover { transform: translateY(-8px); background: white; border-color: #ff9800; }
        .tool-icon { font-size: 3rem; margin-bottom: 15px; }
        .tool-title { font-size: 1.3rem; font-weight: 700; color: #0a2e5c; }
        .tool-desc { font-size: 0.85rem; color: #666; margin-top: 8px; }
        .back-btn {
            background: #ff9800; color: #1a2a3a; border: none; padding: 12px 24px;
            border-radius: 40px; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-bottom: 25px; display: inline-flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { background: #e68900; transform: translateX(-5px); }
        .converter-page { background: white; border-radius: 24px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .category-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; }
        .cat-tab { background: #f0f4f8; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; }
        .cat-tab.active { background: #0a2e5c; color: white; }
        .input-section { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; margin-bottom: 30px; align-items: end; }
        .input-group { flex: 1; }
        .input-label { font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 8px; display: block; }
        .value-input, .unit-select-input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; }
        .swap-icon { font-size: 2rem; color: #ff9800; cursor: pointer; text-align: center; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 25px; }
        .result-card { background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: center; border-left: 4px solid #ff9800; }
        .result-card .value { font-size: 1rem; font-weight: 700; color: #0a2e5c; }
        .result-card .unit { font-size: 0.7rem; color: #888; margin-top: 5px; }
        .section-title { font-size: 1.2rem; font-weight: 700; color: #0a2e5c; margin: 20px 0 15px 0; padding-bottom: 10px; border-bottom: 2px solid #ff9800; }
        .gas-calc-section { background: #f0f4f8; border-radius: 16px; padding: 20px; margin-top: 30px; }
        .gas-input-row { margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .gas-input-row label { width: 160px; font-size: 0.85rem; font-weight: 500; color: #555; }
        .gas-input-row input { flex: 1; min-width: 120px; padding: 8px 12px; border: 2px solid #ddd; border-radius: 8px; }
        .gas-input-row .blue-input { background: #e3f2fd; border-color: #2196f3; }
        .gas-result { font-weight: bold; color: #0a2e5c; background: #e8f0fe; padding: 8px 12px; border-radius: 8px; flex: 1; text-align: center; }
        .gas-grid-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        @media (max-width: 768px) {
            .input-section { grid-template-columns: 1fr; }
            .swap-icon { transform: rotate(90deg); padding: 10px; }
            .gas-grid-2col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
    // Anti-copy
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c')) e.preventDefault();
        if (e.key === 'F12') e.preventDefault();
    });

    function formatNumber(n) {
        if (isNaN(n) || n === null) return "0";
        if (n === 0) return "0";
        if (Math.abs(n) < 0.0001 && Math.abs(n) > 0) return n.toExponential(4);
        if (Math.abs(n) >= 1000000) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
        return n.toFixed(6).replace(/\.?0+$/, '');
    }

    const unitCategories = {
        length: { name: "📏 Length", units: { "meter":1, "kilometer":0.001, "centimeter":100, "millimeter":1000, "mile":0.000621371, "yard":1.09361, "foot":3.28084, "inch":39.3701 }, order: ["meter","kilometer","centimeter","millimeter","mile","yard","foot","inch"] },
        pressure: { name: "⚡ Pressure", units: { "bar":1, "psi":14.5038, "kPa":100, "MPa":0.1, "atm":0.986923, "kg/cm²":1.01972 }, order: ["bar","psi","kPa","MPa","atm","kg/cm²"] },
        temperature: { name: "🌡️ Temperature", special: true, convert: (v,f,t) => { let c; if(f==="°C")c=v; else if(f==="°F")c=(v-32)*5/9; else if(f==="K")c=v-273.15; else c=v; if(t==="°C")return c; if(t==="°F")return c*9/5+32; if(t==="K")return c+273.15; return c*9/5+32; }, units: ["°C","°F","K"], order: ["°C","°F","K"] },
        volumetric_flow: { name: "💧 Volumetric Flow", units: { "m³/hr":1, "m³/day":24, "L/min":16.6667, "US GPM":4.4029, "BLPD":150.955, "ft³/hr":35.3147 }, order: ["m³/hr","m³/day","L/min","US GPM","BLPD","ft³/hr"] },
        mass_flow: { name: "⚖️ Mass Flow", units: { "kg/hr":1, "kg/s":0.00027778, "lb/hr":2.20462, "lb/s":0.0006124 }, order: ["kg/hr","kg/s","lb/hr","lb/s"] },
        gas_flow: { name: "🔥 Gas Flow", units: { "Nm³/hr":1, "Sm³/hr":1.057, "MMSCFD":0.0008958, "SCFM":0.62208, "kmol/hr":0.04464 }, order: ["Nm³/hr","Sm³/hr","MMSCFD","SCFM","kmol/hr"] },
        volume: { name: "🧴 Volume", units: { "m³":1, "liter":1000, "gallon":264.172, "barrel":6.2898, "ft³":35.3147 }, order: ["m³","liter","gallon","barrel","ft³"] },
        density: { name: "🎯 Density", units: { "kg/m³":1, "g/cm³":0.001, "lb/ft³":0.06243, "SG":0.001 }, order: ["kg/m³","g/cm³","lb/ft³","SG"] },
        viscosity: { name: "🔄 Viscosity", units: { "cP":1000, "Pa·s":1, "lb/ft·s":0.672 }, order: ["cP","Pa·s","lb/ft·s"] },
        power: { name: "💪 Power", units: { "kW":1, "MW":0.001, "hp":1.34102, "W":1000 }, order: ["kW","MW","hp","W"] },
        area: { name: "📐 Area", units: { "m²":1, "ft²":10.7639, "in²":1550 }, order: ["m²","ft²","in²"] }
    };

    let currentView = "dashboard";
    let currentCat = "length";
    let inputVal = 1;
    let fromUnit = "meter";
    let toUnit = "kilometer";

    const tools = [
        { id: "unit_converter", icon: "📐", name: "Unit Conversion", desc: "Complete unit converter" },
        { id: "gas_phase", icon: "🔥", name: "Gas Phase Calculator", desc: "Flowrate & ideal gas law" }
    ];

    function renderDashboard() {
        return `
            <div class="header"><h1><span>🛠️</span> Process Engineer's Tool</h1><p>Oil & Gas</p></div>
            <div class="dashboard-grid">${tools.map(t => `<div class="tool-card" onclick="selectTool('${t.id}')"><div class="tool-icon">${t.icon}</div><div class="tool-title">${t.name}</div><div class="tool-desc">${t.desc}</div></div>`).join('')}</div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
            <div class="copyright">© 2024 Process Engineer's Tool. All rights reserved.</div>
        `;
    }

    function getConversions() {
        const cat = unitCategories[currentCat];
        const list = cat.order;
        let conv = {};
        if (cat.special) {
            list.forEach(u => { conv[u] = cat.convert(inputVal, fromUnit, u); });
        } else {
            const base = inputVal / cat.units[fromUnit];
            list.forEach(u => { conv[u] = base * cat.units[u]; });
        }
        return conv;
    }

    // Gas Phase Functions
    function gpFlowFromMass() {
        let mw = parseFloat(document.getElementById('gp_mw_mass')?.value) || 0;
        let mass = parseFloat(document.getElementById('gp_mass_flow')?.value) || 0;
        if (mw > 0 && mass > 0) {
            let molar = mass / mw;
            let vol = molar * 22.414;
            if (document.getElementById('gp_molar_out')) document.getElementById('gp_molar_out').innerHTML = `<strong>${molar.toFixed(4)}</strong> kmol/hr`;
            if (document.getElementById('gp_vol_out')) document.getElementById('gp_vol_out').innerHTML = `<strong>${vol.toFixed(2)}</strong> Nm³/hr`;
        }
    }
    function gpFlowFromVol() {
        let mw = parseFloat(document.getElementById('gp_mw_vol')?.value) || 0;
        let vol = parseFloat(document.getElementById('gp_vol_flow')?.value) || 0;
        if (mw > 0 && vol > 0) {
            let molar = vol / 22.414;
            let mass = molar * mw;
            if (document.getElementById('gp_molar_out2')) document.getElementById('gp_molar_out2').innerHTML = `<strong>${molar.toFixed(4)}</strong> kmol/hr`;
            if (document.getElementById('gp_mass_out2')) document.getElementById('gp_mass_out2').innerHTML = `<strong>${mass.toFixed(2)}</strong> kg/hr`;
        }
    }
    function gpActualToNorm() {
        let p = parseFloat(document.getElementById('gp_act_p')?.value) || 0;
        let t = parseFloat(document.getElementById('gp_act_t')?.value) || 0;
        let actual = parseFloat(document.getElementById('gp_act_vol')?.value) || 0;
        if (p > 0 && t > 0 && actual > 0) {
            let norm = actual * (p / 101.325) * (273.15 / t);
            let molar = norm / 22.414;
            if (document.getElementById('gp_norm_out')) document.getElementById('gp_norm_out').innerHTML = `<strong>${norm.toFixed(2)}</strong> Nm³/hr`;
            if (document.getElementById('gp_molar_act_out')) document.getElementById('gp_molar_act_out').innerHTML = `<strong>${molar.toFixed(4)}</strong> kmol/hr`;
        }
    }
    function gpNormToActual() {
        let p = parseFloat(document.getElementById('gp_norm_p')?.value) || 0;
        let t = parseFloat(document.getElementById('gp_norm_t')?.value) || 0;
        let norm = parseFloat(document.getElementById('gp_norm_vol')?.value) || 0;
        if (p > 0 && t > 0 && norm > 0) {
            let actual = norm * (101.325 / p) * (t / 273.15);
            let molar = norm / 22.414;
            if (document.getElementById('gp_actual_out')) document.getElementById('gp_actual_out').innerHTML = `<strong>${actual.toFixed(2)}</strong> m³/hr`;
            if (document.getElementById('gp_molar_norm_out')) document.getElementById('gp_molar_norm_out').innerHTML = `<strong>${molar.toFixed(4)}</strong> kmol/hr`;
        }
    }
    function gpIdealGas() {
        let solve = document.getElementById('gp_ideal_solve')?.value;
        let p = parseFloat(document.getElementById('gp_ideal_p')?.value) || 0;
        let t = parseFloat(document.getElementById('gp_ideal_t')?.value) || 0;
        let mw = parseFloat(document.getElementById('gp_ideal_mw')?.value) || 0;
        let vol = parseFloat(document.getElementById('gp_ideal_vol')?.value) || 0;
        let mass = parseFloat(document.getElementById('gp_ideal_mass')?.value) || 0;
        let R = 8.31447;
        if (solve === "pressure" && t > 0 && mw > 0 && vol > 0) {
            let res = (vol * R * t) / (mw * 22.414 / 101.325);
            if (document.getElementById('gp_ideal_result')) document.getElementById('gp_ideal_result').innerHTML = `<strong>${res.toFixed(2)}</strong> kPa a`;
        }
        if (solve === "temperature" && p > 0 && mw > 0 && vol > 0) {
            let res = (p * mw * 22.414) / (vol * R / 101.325);
            if (document.getElementById('gp_ideal_result')) document.getElementById('gp_ideal_result').innerHTML = `<strong>${res.toFixed(2)}</strong> K`;
        }
        if (solve === "vol_flow" && p > 0 && t > 0 && mw > 0 && mass > 0) {
            let res = (mass * R * t) / (p * mw * 1000 / 101.325);
            if (document.getElementById('gp_ideal_result')) document.getElementById('gp_ideal_result').innerHTML = `<strong>${res.toFixed(2)}</strong> m³/hr`;
        }
        if (solve === "mass_flow" && p > 0 && t > 0 && mw > 0 && vol > 0) {
            let res = (p * mw * vol) / (R * t / 101.325 * 1000);
            if (document.getElementById('gp_ideal_result')) document.getElementById('gp_ideal_result').innerHTML = `<strong>${res.toFixed(2)}</strong> kg/hr`;
        }
    }

    function renderUnitConverter() {
        const cat = unitCategories[currentCat];
        const list = cat.order;
        const conv = getConversions();
        const showGasCalc = (currentCat === "gas_flow");
        
        return `
            <button class="back-btn" onclick="goBack()">← Back</button>
            <div class="converter-page">
                <h2>${cat.name} Converter</h2>
                <div class="category-tabs">
                    ${Object.keys(unitCategories).map(c => `<button class="cat-tab ${c===currentCat?'active':''}" onclick="switchCat('${c}')">${unitCategories[c].name}</button>`).join('')}
                </div>
                <div class="input-section">
                    <div><label class="input-label">From Value</label><input type="number" id="fromVal" class="value-input" value="${inputVal}" oninput="updateVal(this.value)"></div>
                    <div><label class="input-label">From Unit</label><select id="fromUnitSelect" class="unit-select-input" onchange="updateFrom(this.value)">${list.map(u => `<option ${u===fromUnit?'selected':''}>${u}</option>`).join('')}</select></div>
                    <div class="swap-icon" onclick="swapUnits()">⇅</div>
                    <div><label class="input-label">To Unit</label><select id="toUnitSelect" class="unit-select-input" onchange="updateTo(this.value)">${list.map(u => `<option ${u===toUnit?'selected':''}>${u}</option>`).join('')}</select></div>
                    <div><label class="input-label">Preview</label><input type="text" class="value-input" value="${formatNumber(conv[toUnit])}" readonly style="background:#f5f5f5;"></div>
                </div>
                <div class="section-title">All Results (from ${fromUnit})</div>
                <div class="results-grid">${list.map(u => `<div class="result-card"><div class="value">${formatNumber(conv[u])}</div><div class="unit">${u}</div></div>`).join('')}</div>
                ${showGasCalc ? `
                <div class="gas-calc-section">
                    <h3>🔥 Gas Phase Calculator</h3>
                    <div class="gas-grid-2col">
                        <div>
                            <h4>Flowrate</h4>
                            <div class="gas-input-row"><label>MW + Mass Flow</label><input id="gp_mw_mass" class="blue-input" value="28" oninput="gpFlowFromMass()"><span>kg/kmol</span><input id="gp_mass_flow" class="blue-input" value="20000" oninput="gpFlowFromMass()"><span>kg/hr</span></div>
                            <div class="gas-input-row"><label>→ Molar Flow</label><div class="gas-result" id="gp_molar_out"><strong>714.2857</strong> kmol/hr</div></div>
                            <div class="gas-input-row"><label>→ Vol Flow</label><div class="gas-result" id="gp_vol_out"><strong>16007.14</strong> Nm³/hr</div></div>
                            <hr>
                            <div class="gas-input-row"><label>MW + Vol Flow</label><input id="gp_mw_vol" class="blue-input" value="28" oninput="gpFlowFromVol()"><span>kg/kmol</span><input id="gp_vol_flow" class="blue-input" value="16007" oninput="gpFlowFromVol()"><span>Nm³/hr</span></div>
                            <div class="gas-input-row"><label>→ Molar Flow</label><div class="gas-result" id="gp_molar_out2"><strong>714.2857</strong> kmol/hr</div></div>
                            <div class="gas-input-row"><label>→ Mass Flow</label><div class="gas-result" id="gp_mass_out2"><strong>20000.00</strong> kg/hr</div></div>
                        </div>
                        <div>
                            <h4>Actual Volumetric Flow</h4>
                            <div class="gas-input-row"><label>Actual → Normal</label><input id="gp_act_p" class="blue-input" value="800" oninput="gpActualToNorm()"><span>kPa g</span><input id="gp_act_t" class="blue-input" value="308" oninput="gpActualToNorm()"><span>K</span><input id="gp_act_vol" class="blue-input" value="100" oninput="gpActualToNorm()"><span>m³/hr</span></div>
                            <div class="gas-input-row"><label>→ Normal Flow</label><div class="gas-result" id="gp_norm_out"><strong>--</strong> Nm³/hr</div></div>
                            <div class="gas-input-row"><label>→ Molar Flow</label><div class="gas-result" id="gp_molar_act_out"><strong>--</strong> kmol/hr</div></div>
                            <hr>
                            <div class="gas-input-row"><label>Normal → Actual</label><input id="gp_norm_p" class="blue-input" value="800" oninput="gpNormToActual()"><span>kPa g</span><input id="gp_norm_t" class="blue-input" value="308" oninput="gpNormToActual()"><span>K</span><input id="gp_norm_vol" class="blue-input" value="16007" oninput="gpNormToActual()"><span>Nm³/hr</span></div>
                            <div class="gas-input-row"><label>→ Actual Flow</label><div class="gas-result" id="gp_actual_out"><strong>--</strong> m³/hr</div></div>
                            <div class="gas-input-row"><label>→ Molar Flow</label><div class="gas-result" id="gp_molar_norm_out"><strong>--</strong> kmol/hr</div></div>
                        </div>
                    </div>
                    <div style="margin-top:20px">
                        <h4>Ideal Gas Law</h4>
                        <div class="gas-input-row"><label>Solve for</label><select id="gp_ideal_solve" onchange="gpIdealGas()"><option value="pressure">Pressure</option><option value="temperature">Temperature</option><option value="vol_flow">Vol Flow</option><option value="mass_flow">Mass Flow</option></select></div>
                        <div class="gas-input-row"><label>Values</label><input id="gp_ideal_p" value="101.325" placeholder="P" oninput="gpIdealGas()"><span>kPa a</span><input id="gp_ideal_t" value="273" placeholder="T" oninput="gpIdealGas()"><span>K</span><input id="gp_ideal_mw" value="28" placeholder="MW" oninput="gpIdealGas()"><span>kg/kmol</span><input id="gp_ideal_mass" value="1000" placeholder="Mass" oninput="gpIdealGas()"><span>kg/hr</span><input id="gp_ideal_vol" value="800" placeholder="Vol" oninput="gpIdealGas()"><span>m³/hr</span></div>
                        <div class="gas-input-row"><label>→ Result</label><div class="gas-result" id="gp_ideal_result"><strong>--</strong></div></div>
                    </div>
                </div>
                ` : ''}
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
            <div class="copyright">© 2024 Process Engineer's Tool. All rights reserved.</div>
        `;
    }

    function renderGasPhaseOnly() {
        return `
            <button class="back-btn" onclick="goBack()">← Back</button>
            <div class="converter-page">
                <h2>🔥 Gas Phase Calculator</h2>
                <div class="gas-calc-section" style="margin-top:0">
                    <div class="gas-grid-2col">
                        <div>
                            <h4>Flowrate</h4>
                            <div class="gas-input-row"><label>MW + Mass Flow</label><input id="gp_mw_mass" class="blue-input" value="28" oninput="gpFlowFromMass()"><span>kg/kmol</span><input id="gp_mass_flow" class="blue-input" value="20000" oninput="gpFlowFromMass()"><span>kg/hr</span></div>
                            <div class="gas-input-row"><label>→ Molar Flow</label><div class="gas-result" id="gp_molar_out"><strong>714.2857</strong> kmol/hr</div></div>
                            <div class="gas-input-row"><label>→ Vol Flow</label><div class="gas-result" id="gp_vol_out"><strong>16007.14</strong> Nm³/hr</div></div>
                            <hr>
                            <div class="gas-input-row"><label>MW + Vol Flow</label><input id="gp_mw_vol" class="blue-input" value="28" oninput="gpFlowFromVol()"><span>kg/kmol</span><input id="gp_vol_flow" class="blue-input" value="16007" oninput="gpFlowFromVol()"><span>Nm³/hr</span></div>
                            <div class="gas-input-row"><label>→ Molar Flow</label><div class="gas-result" id="gp_molar_out2"><strong>714.2857</strong> kmol/hr</div></div>
                            <div class="gas-input-row"><label>→ Mass Flow</label><div class="gas-result" id="gp_mass_out2"><strong>20000.00</strong> kg/hr</div></div>
                        </div>
                        <div>
                            <h4>Actual Volumetric Flow</h4>
                            <div class="gas-input-row"><label>Actual → Normal</label><input id="gp_act_p" class="blue-input" value="800" oninput="gpActualToNorm()"><span>kPa g</span><input id="gp_act_t" class="blue-input" value="308" oninput="gpActualToNorm()"><span>K</span><input id="gp_act_vol" class="blue-input" value="100" oninput="gpActualToNorm()"><span>m³/hr</span></div>
                            <div class="gas-input-row"><label>→ Normal Flow</label><div class="gas-result" id="gp_norm_out"><strong>--</strong> Nm³/hr</div></div>
                            <div class="gas-input-row"><label>→ Molar Flow</label><div class="gas-result" id="gp_molar_act_out"><strong>--</strong> kmol/hr</div></div>
                            <hr>
                            <div class="gas-input-row"><label>Normal → Actual</label><input id="gp_norm_p" class="blue-input" value="800" oninput="gpNormToActual()"><span>kPa g</span><input id="gp_norm_t" class="blue-input" value="308" oninput="gpNormToActual()"><span>K</span><input id="gp_norm_vol" class="blue-input" value="16007" oninput="gpNormToActual()"><span>Nm³/hr</span></div>
                            <div class="gas-input-row"><label>→ Actual Flow</label><div class="gas-result" id="gp_actual_out"><strong>--</strong> m³/hr</div></div>
                            <div class="gas-input-row"><label>→ Molar Flow</label><div class="gas-result" id="gp_molar_norm_out"><strong>--</strong> kmol/hr</div></div>
                        </div>
                    </div>
                    <div style="margin-top:20px">
                        <h4>Ideal Gas Law</h4>
                        <div class="gas-input-row"><label>Solve for</label><select id="gp_ideal_solve" onchange="gpIdealGas()"><option value="pressure">Pressure</option><option value="temperature">Temperature</option><option value="vol_flow">Vol Flow</option><option value="mass_flow">Mass Flow</option></select></div>
                        <div class="gas-input-row"><label>Values</label><input id="gp_ideal_p" value="101.325" placeholder="P" oninput="gpIdealGas()"><span>kPa a</span><input id="gp_ideal_t" value="273" placeholder="T" oninput="gpIdealGas()"><span>K</span><input id="gp_ideal_mw" value="28" placeholder="MW" oninput="gpIdealGas()"><span>kg/kmol</span><input id="gp_ideal_mass" value="1000" placeholder="Mass" oninput="gpIdealGas()"><span>kg/hr</span><input id="gp_ideal_vol" value="800" placeholder="Vol" oninput="gpIdealGas()"><span>m³/hr</span></div>
                        <div class="gas-input-row"><label>→ Result</label><div class="gas-result" id="gp_ideal_result"><strong>--</strong></div></div>
                    </div>
                </div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
            <div class="copyright">© 2024 Process Engineer's Tool. All rights reserved.</div>
        `;
    }

    window.selectTool = function(id) {
        currentView = id;
        if (id === "unit_converter") { currentCat = "length"; fromUnit = "meter"; toUnit = "kilometer"; inputVal = 1; }
        renderApp();
        if (id === "unit_converter" || id === "gas_phase") {
            setTimeout(() => {
                if (document.getElementById('gp_mw_mass')) gpFlowFromMass();
                if (document.getElementById('gp_mw_vol')) gpFlowFromVol();
                if (document.getElementById('gp_act_p')) gpActualToNorm();
                if (document.getElementById('gp_norm_p')) gpNormToActual();
                if (document.getElementById('gp_ideal_solve')) gpIdealGas();
            }, 50);
        }
    };
    window.goBack = function() { currentView = "dashboard"; renderApp(); };
    window.switchCat = function(cat) { currentCat = cat; const catObj = unitCategories[cat]; fromUnit = catObj.order[0]; toUnit = catObj.order[1] || catObj.order[0]; inputVal = 1; renderApp(); };
    window.updateVal = function(v) { inputVal = parseFloat(v) || 0; renderApp(); };
    window.updateFrom = function(u) { fromUnit = u; renderApp(); };
    window.updateTo = function(u) { toUnit = u; renderApp(); };
    window.swapUnits = function() { let temp = fromUnit; fromUnit = toUnit; toUnit = temp; renderApp(); };

    function renderApp() {
        const app = document.getElementById("app");
        if (currentView === "dashboard") app.innerHTML = renderDashboard();
        else if (currentView === "unit_converter") app.innerHTML = renderUnitConverter();
        else if (currentView === "gas_phase") app.innerHTML = renderGasPhaseOnly();
        else app.innerHTML = renderDashboard();
    }
    renderApp();
</script>
</body>
</html>
