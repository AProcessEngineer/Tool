<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Engineer's Unit Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2b3d 0%, #1a4a6f 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .header h1 span {
            color: #ffd966;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .tabs {
            display: flex;
            background: #1e3a5f;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 12px;
            color: #b8d4f0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .tab-btn:hover {
            background: #2a4a75;
            color: white;
        }
        .tab-btn.active {
            background: #ffd966;
            color: #1e3a5f;
        }
        .sub-tabs {
            display: flex;
            background: #2a4a75;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        .sub-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            color: #c0ddf5;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }
        .sub-btn.active {
            background: #ffd966;
            color: #1e3a5f;
            font-weight: 600;
        }
        .converter-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e3a5f;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffd966;
            display: inline-block;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ffd966;
        }
        .swap-btn {
            background: #1e3a5f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin: 10px 0;
            width: 100%;
        }
        .swap-btn:hover {
            background: #0f2b3d;
        }
        .result {
            background: #f0f4f8;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }
        .result-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-value {
            font-size: 28px;
            font-weight: 700;
            color: #1e3a5f;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }
        @media (max-width: 500px) {
            .tab-btn { font-size: 13px; padding: 10px; }
            .result-value { font-size: 22px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Process Engineer's <span>Unit Converter</span></h1>
        <p>Oil & Gas | Offshore/Onshore | Piping & Hydraulics</p>
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="general">📐 General</button>
        <button class="tab-btn" data-tab="pressure">⚡ Pressure</button>
        <button class="tab-btn" data-tab="temperature">🌡️ Temperature</button>
    </div>
    <div id="subTabs" class="sub-tabs">
        <button class="sub-btn active" data-sub="length">📏 Length</button>
        <button class="sub-btn" data-sub="area">📐 Area</button>
        <button class="sub-btn" data-sub="volume">🧴 Volume</button>
    </div>
    <div class="converter-card">
        <h2 class="card-title" id="cardTitle">Length Converter</h2>
        <div class="input-group">
            <label>From:</label>
            <input type="number" id="inputValue" value="1" step="any">
        </div>
        <div class="input-group">
            <label>From Unit:</label>
            <select id="fromUnit"></select>
        </div>
        <button class="swap-btn" id="swapBtn">⇅ Swap Units</button>
        <div class="input-group">
            <label>To Unit:</label>
            <select id="toUnit"></select>
        </div>
        <div class="result">
            <div class="result-label">Converted Value</div>
            <div class="result-value" id="result">—</div>
        </div>
    </div>
    <div class="footer">
        ⚙️ Process Engineering Tool | Pressure • Temperature • Length
    </div>
</div>
<script>
    const lengthUnits = {
        'meter': 1, 'kilometer': 1000, 'centimeter': 0.01, 'millimeter': 0.001,
        'mile': 1609.344, 'yard': 0.9144, 'foot': 0.3048, 'inch': 0.0254
    };
    const pressureUnits = {
        'bar': 1, 'psi': 0.0689476, 'kPa': 0.01, 'MPa': 10, 'kg/cm²': 0.980665, 'Pa': 0.00001, 'atm': 1.01325
    };
    const tempUnits = ['°C', '°F', 'K', '°R'];
    const areaUnits = {
        'sq meter': 1, 'sq km': 1e6, 'sq foot': 0.092903, 'sq inch': 0.00064516, 'acre': 4046.86, 'hectare': 10000
    };
    const volumeUnits = {
        'cubic meter': 1, 'liter': 0.001, 'gallon (US)': 0.00378541, 'gallon (UK)': 0.00454609, 'barrel (oil)': 0.158987, 'cubic foot': 0.0283168
    };
    let currentTab = 'general';
    let currentSub = 'length';
    function convertLength(value, fromUnit, toUnit) { return value * lengthUnits[fromUnit] / lengthUnits[toUnit]; }
    function convertPressure(value, fromUnit, toUnit) { return value * pressureUnits[fromUnit] / pressureUnits[toUnit]; }
    function convertTemperature(value, fromUnit, toUnit) {
        let celsius;
        if (fromUnit === '°C') celsius = value;
        else if (fromUnit === '°F') celsius = (value - 32) * 5/9;
        else if (fromUnit === 'K') celsius = value - 273.15;
        else if (fromUnit === '°R') celsius = (value - 491.67) * 5/9;
        else return value;
        if (toUnit === '°C') return celsius;
        if (toUnit === '°F') return celsius * 9/5 + 32;
        if (toUnit === 'K') return celsius + 273.15;
        if (toUnit === '°R') return (celsius + 273.15) * 9/5;
        return celsius;
    }
    function convertArea(value, fromUnit, toUnit) { return value * areaUnits[fromUnit] / areaUnits[toUnit]; }
    function convertVolume(value, fromUnit, toUnit) { return value * volumeUnits[fromUnit] / volumeUnits[toUnit]; }
    function updateUI() {
        const fromSelect = document.getElementById('fromUnit');
        const toSelect = document.getElementById('toUnit');
        const cardTitle = document.getElementById('cardTitle');
        let units, conversionFunc, title;
        if (currentTab === 'general') {
            if (currentSub === 'length') { units = Object.keys(lengthUnits); conversionFunc = convertLength; title = '📏 Length Converter'; }
            else if (currentSub === 'area') { units = Object.keys(areaUnits); conversionFunc = convertArea; title = '📐 Area Converter'; }
            else { units = Object.keys(volumeUnits); conversionFunc = convertVolume; title = '🧴 Volume Converter'; }
        } else if (currentTab === 'pressure') { units = Object.keys(pressureUnits); conversionFunc = convertPressure; title = '⚡ Pressure Converter'; }
        else { units = tempUnits; conversionFunc = convertTemperature; title = '🌡️ Temperature Converter'; }
        cardTitle.innerText = title;
        const oldFrom = fromSelect.value, oldTo = toSelect.value;
        fromSelect.innerHTML = ''; toSelect.innerHTML = '';
        units.forEach(unit => {
            fromSelect.appendChild(new Option(unit, unit));
            toSelect.appendChild(new Option(unit, unit));
        });
        if (units.includes(oldFrom)) fromSelect.value = oldFrom;
        if (units.includes(oldTo)) toSelect.value = oldTo;
        if (currentTab === 'general' && currentSub === 'length') { if (!fromSelect.value) fromSelect.value = 'meter'; if (!toSelect.value) toSelect.value = 'foot'; }
        else if (currentTab === 'general' && currentSub === 'area') { if (!fromSelect.value) fromSelect.value = 'sq meter'; if (!toSelect.value) toSelect.value = 'sq foot'; }
        else if (currentTab === 'general' && currentSub === 'volume') { if (!fromSelect.value) fromSelect.value = 'cubic meter'; if (!toSelect.value) toSelect.value = 'gallon (US)'; }
        else if (currentTab === 'pressure') { if (!fromSelect.value) fromSelect.value = 'bar'; if (!toSelect.value) toSelect.value = 'psi'; }
        else { if (!fromSelect.value) fromSelect.value = '°C'; if (!toSelect.value) toSelect.value = '°F'; }
        performConversion();
    }
    function performConversion() {
        const inputValue = parseFloat(document.getElementById('inputValue').value) || 0;
        const fromUnit = document.getElementById('fromUnit').value;
        const toUnit = document.getElementById('toUnit').value;
        if (!fromUnit || !toUnit) return;
        let result;
        if (currentTab === 'general') {
            if (currentSub === 'length') result = convertLength(inputValue, fromUnit, toUnit);
            else if (currentSub === 'area') result = convertArea(inputValue, fromUnit, toUnit);
            else result = convertVolume(inputValue, fromUnit, toUnit);
        } else if (currentTab === 'pressure') result = convertPressure(inputValue, fromUnit, toUnit);
        else result = convertTemperature(inputValue, fromUnit, toUnit);
        document.getElementById('result').innerText = `${result.toLocaleString(undefined, {minimumFractionDigits: 4, maximumFractionDigits: 6})} ${toUnit}`;
    }
    function swapUnits() { const f=document.getElementById('fromUnit'), t=document.getElementById('toUnit'), temp=f.value; f.value=t.value; t.value=temp; performConversion(); }
    document.getElementById('inputValue').addEventListener('input', performConversion);
    document.getElementById('fromUnit').addEventListener('change', performConversion);
    document.getElementById('toUnit').addEventListener('change', performConversion);
    document.getElementById('swapBtn').addEventListener('click', swapUnits);
    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.getAttribute('data-tab');
        document.getElementById('subTabs').style.display = currentTab === 'general' ? 'flex' : 'none';
        updateUI();
    }));
    document.querySelectorAll('.sub-btn').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentSub = btn.getAttribute('data-sub');
        updateUI();
    }));
    updateUI();
</script>
</body>
</html>
