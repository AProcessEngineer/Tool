<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google-site-verification" content="pLzoZiJTZLKHLwS9LkGWCiKIUB98ZtE8PqpDrAy6ASA" />
    <title>Process Engineer's Tool - Oil & Gas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2e5c 0%, #0a4c6e 100%);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; padding: 20px; }
        .header h1 { font-size: 2.5rem; color: white; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
        .header h1 span { color: #ff9800; }
        .header p { color: #b8d4f0; font-size: 1.1rem; margin-top: 10px; }
        .footer-quote { text-align: center; margin-top: 50px; padding: 20px; border-top: 1px solid rgba(255,255,255,0.2); color: #ff9800; font-style: italic; }
        .copyright { text-align: center; font-size: 0.7rem; color: #888; margin-top: 10px; padding: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .tool-card {
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 28px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .tool-card:hover { transform: translateY(-8px); background: white; border-color: #ff9800; }
        .tool-icon { font-size: 3rem; margin-bottom: 15px; }
        .tool-title { font-size: 1.3rem; font-weight: 700; color: #0a2e5c; }
        .tool-desc { font-size: 0.85rem; color: #666; margin-top: 8px; }
        .back-btn {
            background: #ff9800; color: #1a2a3a; border: none; padding: 12px 24px;
            border-radius: 40px; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-bottom: 25px; display: inline-flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { background: #e68900; transform: translateX(-5px); }
        .converter-page, .tool-page { background: white; border-radius: 24px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .category-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; max-height: 250px; overflow-y: auto; }
        .cat-tab { background: #f0f4f8; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
        .cat-tab.active { background: #0a2e5c; color: white; }
        .input-section { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; margin-bottom: 30px; align-items: end; }
        .input-group { flex: 1; }
        .input-label { font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 8px; display: block; }
        .value-input, .unit-select-input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; }
        .value-input:focus, .unit-select-input:focus { outline: none; border-color: #ff9800; }
        .swap-icon { font-size: 2rem; color: #ff9800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 25px; }
        .result-card { background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: center; border-left: 4px solid #ff9800; }
        .result-card .value { font-size: 1rem; font-weight: 700; color: #0a2e5c; word-break: break-word; }
        .result-card .unit { font-size: 0.7rem; color: #888; margin-top: 5px; }
        .section-title { font-size: 1.2rem; font-weight: 700; color: #0a2e5c; margin: 20px 0 15px 0; padding-bottom: 10px; border-bottom: 2px solid #ff9800; }
        
        /* Gas Phase Calculator Styles */
        .gas-calc-section { background: #f0f4f8; border-radius: 16px; padding: 20px; margin-top: 30px; }
        .gas-calc-section h3 { color: #0a2e5c; margin-bottom: 15px; }
        .gas-input-row { margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .gas-input-row label { width: 140px; font-size: 0.85rem; font-weight: 500; color: #555; }
        .gas-input-row input, .gas-input-row select { flex: 1; min-width: 120px; padding: 8px 12px; border: 2px solid #ddd; border-radius: 8px; }
        .gas-input-row .blue-input { background: #e3f2fd !important; border-color: #2196f3 !important; }
        .gas-result { font-weight: bold; color: #0a2e5c; background: #e8f0fe; padding: 8px 12px; border-radius: 8px; flex: 1; text-align: center; }
        .gas-grid-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 15px; }
        hr { margin: 15px 0; border: none; border-top: 1px solid #ddd; }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            .input-section { grid-template-columns: 1fr; }
            .swap-icon { transform: rotate(90deg); padding: 10px 0; }
            .gas-grid-2col { grid-template-columns: 1fr; }
            .cat-tab { font-size: 0.65rem; padding: 5px 10px; }
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
    // Anti-copy protection
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c' || e.key === 'v' || e.key === 'i')) {
            e.preventDefault(); return false;
        }
        if (e.key === 'F12') { e.preventDefault(); return false; }
    });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
    console.log("%c🔒 Process Engineer's Tool - Content Protected", "color: #ff9800; font-size: 16px; font-weight: bold;");

    function formatNumber(n) {
        if (isNaN(n) || n === null) return "0";
        if (n === 0) return "0";
        if (Math.abs(n) < 0.0001 && Math.abs(n) > 0) return n.toExponential(4);
        if (Math.abs(n) >= 1000000) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
        return parseFloat(n.toFixed(6)).toString();
    }

    // ==================== ALL UNIT CATEGORIES ====================
    const unitCategories = {
        length: { name: "📏 Length", units: { "meter":1, "kilometer":0.001, "centimeter":100, "millimeter":1000, "mile":0.000621371, "yard":1.09361, "foot":3.28084, "inch":39.3701 }, order: ["meter","kilometer","centimeter","millimeter","mile","yard","foot","inch"] },
        pressure_gauge: { name: "⚡ Pressure (Gauge)", units: { "bar g":1, "psi g":14.5038, "kPa g":100, "kg/cm² g":1.01972, "mmHg g":750.062, "mmH₂O g":10197.2 }, order: ["bar g","psi g","kPa g","kg/cm² g","mmHg g","mmH₂O g"] },
        pressure_absolute: { name: "⚡ Pressure (Absolute)", units: { "bar a":1, "psi a":14.5038, "kPa a":100, "kg/cm² a":1.01972, "mmHg a":750.062, "mmH₂O a":10197.2 }, order: ["bar a","psi a","kPa a","kg/cm² a","mmHg a","mmH₂O a"] },
        temperature: { name: "🌡️ Temperature", special: true, convert: (v,f,t)=>{ let c; if(f==="°C")c=v; else if(f==="°F")c=(v-32)*5/9; else if(f==="K")c=v-273.15; else if(f==="°R")c=(v-491.67)*5/9; else c=v; if(t==="°C")return c; if(t==="°F")return c*9/5+32; if(t==="K")return c+273.15; if(t==="°R")return(c+273.15)*9/5; return c; }, units: ["°C","°F","K","°R"], order: ["°C","°F","K","°R"] },
        temperature_interval: { name: "🌡️ Temp Interval", units: { "°C":1, "K":1, "°F":1.8, "°R":1.8 }, order: ["°C","K","°F","°R"] },
        volumetric_flow: { name: "💧 Volumetric Flow", units: { "m³/hr":1, "m³/day":24, "L/min":16.6667, "US GPM":4.4029, "BLPD":150.955, "ft³/hr":35.3147 }, order: ["m³/hr","m³/day","L/min","US GPM","BLPD","ft³/hr"] },
        mass_flow: { name: "⚖️ Mass Flow", units: { "kg/hr":1, "kg/s":0.00027778, "lb/hr":2.20462, "lb/s":0.0006124, "ton/hr":0.001 }, order: ["kg/hr","kg/s","lb/hr","lb/s","ton/hr"] },
        gas_flow: { name: "🔥 Gas Flow", special: true, convert: (v,f,t)=>{ const c={"Nm³/hr":1,"Sm³/hr":1.057,"MMSCFD":0.0008958,"SCFM":0.62208,"SCFD":895.8,"kmol/hr":0.04464,"MMSCMD":2.5368e-5}; if(f===t)return v; return (v/c[f])*c[t]; }, units: ["Nm³/hr","Sm³/hr","MMSCFD","SCFM","SCFD","kmol/hr","MMSCMD"], order: ["Nm³/hr","Sm³/hr","MMSCFD","SCFM","SCFD","kmol/hr","MMSCMD"] },
        volume: { name: "🧴 Volume", units: { "m³":1, "liter":1000, "gallon":264.172, "barrel":6.2898, "ft³":35.3147 }, order: ["m³","liter","gallon","barrel","ft³"] },
        mass: { name: "⚖️ Mass", units: { "kg":1, "g":1000, "lb":2.20462, "ton":0.001 }, order: ["kg","g","lb","ton"] },
        density: { name: "🎯 Density", units: { "kg/m³":1, "g/cm³":0.001, "lb/ft³":0.06243, "SG":0.001 }, order: ["kg/m³","g/cm³","lb/ft³","SG"] },
        dynamic_viscosity: { name: "🔄 Dynamic Viscosity", units: { "cP":1000, "Pa·s":1, "N·s/m²":1, "kg/m·s":1, "lb/ft·s":0.672 }, order: ["cP","Pa·s","N·s/m²","kg/m·s","lb/ft·s"] },
        kinematic_viscosity: { name: "🌊 Kinematic Viscosity", units: { "m²/s":1, "cSt":1e6, "Stokes":10000, "cm²/s":10000, "ft²/s":10.7639 }, order: ["m²/s","cSt","Stokes","cm²/s","ft²/s"] },
        energy: { name: "⚡ Energy", units: { "Joule":1, "kJ":0.001, "Calorie":0.239, "kCal":0.000239, "BTU":0.0009478, "Wh":0.0002778 }, order: ["Joule","kJ","Calorie","kCal","BTU","Wh"] },
        power: { name: "💪 Power", units: { "Watt":1, "kW":0.001, "MW":1e-6, "hp":0.001341, "BTU/hr":3.41214 }, order: ["Watt","kW","MW","hp","BTU/hr"] },
        area: { name: "📐 Area", units: { "m²":1, "cm²":10000, "ft²":10.7639, "in²":1550, "acre":0.0002471 }, order: ["m²","cm²","ft²","in²","acre"] },
        velocity: { name: "🏃 Velocity", units: { "m/s":1, "ft/s":3.28084, "km/h":3.6, "mph":2.23694, "knot":1.94384 }, order: ["m/s","ft/s","km/h","mph","knot"] },
        acceleration: { name: "📈 Acceleration", units: { "m/s²":1, "cm/s²":100, "ft/s²":3.28084, "G force":0.10197 }, order: ["m/s²","cm/s²","ft/s²","G force"] },
        specific_heat: { name: "🔥 Specific Heat", units: { "J/kg·K":1, "kJ/kg·K":0.001, "kcal/kg·°C":0.0002388, "Btu/lb·°F":0.0002388 }, order: ["J/kg·K","kJ/kg·K","kcal/kg·°C","Btu/lb·°F"] },
        thermal_conductivity: { name: "🌡️ Thermal Conductivity", units: { "W/m·K":1, "W/m·°C":1, "kcal/hr·m·°C":0.8598, "Btu/hr·ft·°F":0.5778 }, order: ["W/m·K","W/m·°C","kcal/hr·m·°C","Btu/hr·ft·°F"] },
        gas_constant: { name: "⚙️ Gas Constant", units: { "J/mol·K":1, "kJ/kmol·K":1, "Btu/lbmol·R":0.239, "lbf·ft/lbmol·R":185.86 }, order: ["J/mol·K","kJ/kmol·K","Btu/lbmol·R","lbf·ft/lbmol·R"] },
        molecular_weight: { name: "🧪 Molecular Weight", units: { "g/mol":1, "kg/kmol":1, "lb/lbmol":1 }, order: ["g/mol","kg/kmol","lb/lbmol"] },
        molar_flow: { name: "🔄 Molar Flowrate", units: { "kmol/hr":1, "kmol/s":0.0002778, "lbmol/hr":2.20462, "mol/s":0.27778 }, order: ["kmol/hr","kmol/s","lbmol/hr","mol/s"] },
        diffusivity: { name: "🌊 Diffusivity", units: { "m²/s":1, "cm²/s":10000, "ft²/s":10.7639 }, order: ["m²/s","cm²/s","ft²/s"] },
        electrical_conductivity: { name: "⚡ Electrical Conductivity", units: { "μS/cm":1, "mS/cm":0.001, "µmho/cm":1 }, order: ["μS/cm","mS/cm","µmho/cm"] },
        heat_flux: { name: "🔥 Heat Flux", units: { "W/m²":1, "kW/m²":0.001, "Btu/hr·ft²":0.316998 }, order: ["W/m²","kW/m²","Btu/hr·ft²"] },
        frequency: { name: "📊 Frequency", units: { "Hz":1, "RPM":60, "kHz":0.001, "1/min":60 }, order: ["Hz","RPM","kHz","1/min"] },
        angle: { name: "📐 Angle", units: { "degree":1, "radian":0.0174533, "π rad":0.005556 }, order: ["degree","radian","π rad"] },
        pressure_drop: { name: "📉 Pressure Drop", units: { "bar/100m":1, "psi/100ft":4.4209 }, order: ["bar/100m","psi/100ft"] },
        surface_tension: { name: "💧 Surface Tension", units: { "N/m":1, "dyne/cm":1000, "lbf/in":0.00571 }, order: ["N/m","dyne/cm","lbf/in"] },
        data_transfer: { name: "💾 Data Transfer", units: { "bps":1, "Kbps":0.001, "Mbps":1e-6, "Gbps":1e-9 }, order: ["bps","Kbps","Mbps","Gbps"] },
        momentum: { name: "💨 Momentum", units: { "kg·m/s":1, "lb·ft/s":7.2327 }, order: ["kg·m/s","lb·ft/s"] },
        time: { name: "⏱️ Time", units: { "seconds":1, "minutes":0.016667, "hours":0.00027778, "days":1.157e-5 }, order: ["seconds","minutes","hours","days"] },
        mole: { name: "🧪 Mole", units: { "mole":1, "kmol":0.001, "lbmol":0.002205 }, order: ["mole","kmol","lbmol"] }
    };

    let currentView = "dashboard";
    let currentCat = "length";
    let inputVal = 1;
    let fromUnit = "meter";
    let toUnit = "kilometer";

    // Store DOM elements to avoid re-rendering issues
    let isRendering = false;

    const tools = [
        { id: "unit_converter", icon: "📐", name: "Unit Conversion", desc: "60+ engineering unit categories" },
        { id: "mathematical", icon: "🧮", name: "Mathematical Calculation", desc: "Interpolation, geometry" },
        { id: "line_sizing", icon: "📏", name: "Line Sizing", desc: "Liquid, gas & multiphase flow" },
        { id: "psv_sizing", icon: "🔥", name: "PSV Sizing", desc: "Fire case, blocked discharge" },
        { id: "pump_sizing", icon: "🌀", name: "Pump Sizing", desc: "Pump duty, NPSH" },
        { id: "reference", icon: "📚", name: "Reference", desc: "Pipe thickness, orifice areas" }
    ];

    function renderDashboard() {
        return `
            <div class="header"><h1><span>🛠️</span> Process Engineer's Tool</h1><p>Oil & Gas</p></div>
            <div class="dashboard-grid">${tools.map(t => `<div class="tool-card" onclick="selectTool('${t.id}')"><div class="tool-icon">${t.icon}</div><div class="tool-title">${t.name}</div><div class="tool-desc">${t.desc}</div></div>`).join('')}</div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
            <div class="copyright">© 2024 Process Engineer's Tool. All rights reserved.</div>
        `;
    }

    function getConversions() {
        const cat = unitCategories[currentCat];
        const list = cat.order;
        let conv = {};
        if (cat.special && cat.convert) {
            list.forEach(u => { conv[u] = cat.convert(inputVal, fromUnit, u); });
        } else {
            const base = inputVal / cat.units[fromUnit];
            list.forEach(u => { conv[u] = base * cat.units[u]; });
        }
        return conv;
    }

    // ==================== GAS PHASE CALCULATOR FUNCTIONS ====================
    function gpFlowFromMass() {
        let mw = parseFloat(document.getElementById('gp_mw_mass')?.value) || 0;
        let mass = parseFloat(document.getElementById('gp_mass_flow')?.value) || 0;
        if (mw > 0 && mass > 0) {
            let molar = mass / mw;
            let vol = molar * 22.414;
            let mmd = vol * 0.000001;
            let scfm = vol * 0.000622;
            if (document.getElementById('gp_molar_out')) document.getElementById('gp_molar_out').innerHTML = `<strong>${formatNumber(molar)}</strong> <span style="font-size:0.7rem;">kmol/hr</span>`;
            if (document.getElementById('gp_vol_out')) document.getElementById('gp_vol_out').innerHTML = `<strong>${formatNumber(vol)}</strong> <span style="font-size:0.7rem;">Nm³/hr</span>`;
            if (document.getElementById('gp_scfm_out')) document.getElementById('gp_scfm_out').innerHTML = `<strong>${formatNumber(scfm)}</strong> <span style="font-size:0.7rem;">MMSCFD</span>`;
        }
    }
    function gpFlowFromVol() {
        let mw = parseFloat(document.getElementById('gp_mw_vol')?.value) || 0;
        let vol = parseFloat(document.getElementById('gp_vol_flow')?.value) || 0;
        if (mw > 0 && vol > 0) {
            let molar = vol / 22.414;
            let mass = molar * mw;
            let massLB = mass * 2.20462;
            if (document.getElementById('gp_molar_out2')) document.getElementById('gp_molar_out2').innerHTML = `<strong>${formatNumber(molar)}</strong> <span style="font-size:0.7rem;">kmol/hr</span>`;
            if (document.getElementById('gp_mass_out2')) document.getElementById('gp_mass_out2').innerHTML = `<strong>${formatNumber(mass)}</strong> <span style="font-size:0.7rem;">kg/hr</span>`;
            if (document.getElementById('gp_mass_lb_out')) document.getElementById('gp_mass_lb_out').innerHTML = `<strong>${formatNumber(massLB)}</strong> <span style="font-size:0.7rem;">lb/hr</span>`;
        }
    }
    function gpActualToNorm() {
        let p = parseFloat(document.getElementById('gp_act_p')?.value) || 0;
        let t = parseFloat(document.getElementById('gp_act_t')?.value) || 0;
        let r = parseFloat(document.getElementById('gp_act_r')?.value) || 1;
        let actual = parseFloat(document.getElementById('gp_act_vol')?.value) || 0;
        if (p > 0 && t > 0 && actual > 0) {
            let norm = actual * (p / 101.325) * (273.15 / t) * r;
            let molar = norm / 22.414;
            let mmcfd = norm * 0.0000008958;
            if (document.getElementById('gp_norm_out')) document.getElementById('gp_norm_out').innerHTML = `<strong>${formatNumber(norm)}</strong> <span style="font-size:0.7rem;">Nm³/hr</span>`;
            if (document.getElementById('gp_molar_act_out')) document.getElementById('gp_molar_act_out').innerHTML = `<strong>${formatNumber(molar)}</strong> <span style="font-size:0.7rem;">kmol/hr</span>`;
            if (document.getElementById('gp_mmcfd_out')) document.getElementById('gp_mmcfd_out').innerHTML = `<strong>${formatNumber(mmcfd)}</strong> <span style="font-size:0.7rem;">MMSCFD</span>`;
        }
    }
    function gpNormToActual() {
        let p = parseFloat(document.getElementById('gp_norm_p')?.value) || 0;
        let t = parseFloat(document.getElementById('gp_norm_t')?.value) || 0;
        let r = parseFloat(document.getElementById('gp_norm_r')?.value) || 1;
        let norm = parseFloat(document.getElementById('gp_norm_vol')?.value) || 0;
        if (p > 0 && t > 0 && norm > 0) {
            let actual = norm * (101.325 / p) * (t / 273.15) / r;
            let molar = norm / 22.414;
            if (document.getElementById('gp_actual_out')) document.getElementById('gp_actual_out').innerHTML = `<strong>${formatNumber(actual)}</strong> <span style="font-size:0.7rem;">m³/hr</span>`;
            if (document.getElementById('gp_molar_norm_out')) document.getElementById('gp_molar_norm_out').innerHTML = `<strong>${formatNumber(molar)}</strong> <span style="font-size:0.7rem;">kmol/hr</span>`;
        }
    }
    function gpIdealGas() {
        let solve = document.getElementById('gp_ideal_solve')?.value;
        let p = parseFloat(document.getElementById('gp_ideal_p')?.value) || 0;
        let t = parseFloat(document.getElementById('gp_ideal_t')?.value) || 0;
        let mw = parseFloat(document.getElementById('gp_ideal_mw')?.value) || 0;
        let mass = parseFloat(document.getElementById('gp_ideal_mass')?.value) || 0;
        let vol = parseFloat(document.getElementById('gp_ideal_vol')?.value) || 0;
        let z = parseFloat(document.getElementById('gp_ideal_z')?.value) || 1;
        let R = 8.31447;
        let result = "--";
        if (solve === "pressure" && t > 0 && mw > 0 && vol > 0 && z > 0) {
            result = formatNumber((vol * R * t * z) / (mw * 22.414 / 101.325)) + " kPa a";
        }
        if (solve === "temperature" && p > 0 && mw > 0 && vol > 0 && z > 0) {
            result = formatNumber((p * mw * 22.414) / (vol * R * z / 101.325)) + " K";
        }
        if (solve === "mass_flow" && p > 0 && t > 0 && mw > 0 && vol > 0 && z > 0) {
            result = formatNumber((p * mw * vol) / (R * t * z / 101.325 * 1000)) + " kg/hr";
        }
        if (solve === "vol_flow" && p > 0 && t > 0 && mw > 0 && mass > 0 && z > 0) {
            result = formatNumber((mass * R * t * z) / (p * mw * 1000 / 101.325)) + " m³/hr";
        }
        if (document.getElementById('gp_ideal_result')) document.getElementById('gp_ideal_result').innerHTML = `<strong>${result}</strong>`;
    }

    // Update functions without re-rendering
    function updateFromValue(val) {
        inputVal = parseFloat(val) || 0;
        updateDisplay();
    }
    
    function updateDisplay() {
        const cat = unitCategories[currentCat];
        const list = cat.order;
        const conv = getConversions();
        
        // Update preview
        const preview = document.getElementById('previewResult');
        if (preview) preview.value = formatNumber(conv[toUnit]);
        
        // Update all result cards
        list.forEach(unit => {
            const card = document.getElementById(`result_${unit.replace(/[^a-zA-Z0-9]/g, '_')}`);
            if (card) card.innerHTML = formatNumber(conv[unit]);
        });
        
        // Update gas phase calculations if on gas flow
        if (currentCat === "gas_flow") {
            if (typeof gpFlowFromMass === 'function') gpFlowFromMass();
            if (typeof gpFlowFromVol === 'function') gpFlowFromVol();
            if (typeof gpActualToNorm === 'function') gpActualToNorm();
            if (typeof gpNormToActual === 'function') gpNormToActual();
            if (typeof gpIdealGas === 'function') gpIdealGas();
        }
    }

    function renderUnitConverter() {
        const cat = unitCategories[currentCat];
        const list = cat.order;
        const conv = getConversions();
        const showGasCalc = (currentCat === "gas_flow");
        
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="converter-page">
                <h2 style="color:#0a2e5c;">${cat.name} Converter</h2>
                <div class="category-tabs">
                    ${Object.keys(unitCategories).map(c => `<button class="cat-tab ${c===currentCat?'active':''}" onclick="switchCat('${c}')">${unitCategories[c].name}</button>`).join('')}
                </div>
                <div class="input-section">
                    <div class="input-group"><label class="input-label">📥 From Value</label><input type="number" id="fromValueInput" class="value-input" value="${inputVal}" step="any" oninput="updateFromValue(this.value)"></div>
                    <div class="input-group"><label class="input-label">📤 From Unit</label><select id="fromUnitSelect" class="unit-select-input" onchange="updateFromUnit(this.value)">${list.map(u => `<option value="${u}" ${u===fromUnit?'selected':''}>${u}</option>`).join('')}</select></div>
                    <div class="swap-icon" onclick="swapUnits()">⇅</div>
                    <div class="input-group"><label class="input-label">🎯 To Unit</label><select id="toUnitSelect" class="unit-select-input" onchange="updateToUnit(this.value)">${list.map(u => `<option value="${u}" ${u===toUnit?'selected':''}>${u}</option>`).join('')}</select></div>
                    <div class="input-group"><label class="input-label">✨ Preview</label><input type="text" id="previewResult" class="value-input" value="${formatNumber(conv[toUnit])}" readonly style="background:#f5f5f5;"></div>
                </div>
                <div class="section-title">📊 All Results (from ${fromUnit})</div>
                <div class="results-grid" id="resultsGrid">
                    ${list.map(u => `<div class="result-card"><div class="value" id="result_${u.replace(/[^a-zA-Z0-9]/g, '_')}">${formatNumber(conv[u])}</div><div class="unit">${u}</div></div>`).join('')}
                </div>
                ${showGasCalc ? `
                <div class="gas-calc-section">
                    <h3>🔥 Gas Phase Calculator</h3>
                    <div class="gas-grid-2col">
                        <div>
                            <h4>📊 Flowrate Calculations</h4>
                            <div class="gas-input-row"><label>Molecular Weight</label><input id="gp_mw_mass" class="blue-input" value="28" oninput="gpFlowFromMass()"><span>kg/kmol</span><input id="gp_mass_flow" class="blue-input" value="20000" oninput="gpFlowFromMass()"><span>kg/hr</span></div>
                            <div class="gas-input-row"><label>→ Molar Flowrate</label><div class="gas-result" id="gp_molar_out"><strong>714.2857</strong> kmol/hr</div></div>
                            <div class="gas-input-row"><label>→ Volumetric Flowrate</label><div class="gas-result" id="gp_vol_out"><strong>16007.14</strong> Nm³/hr</div></div>
                            <div class="gas-input-row"><label>→ MMSCFD</label><div class="gas-result" id="gp_scfm_out"><strong>14.34</strong> MMSCFD</div></div>
                            <hr>
                            <div class="gas-input-row"><label>Molecular Weight</label><input id="gp_mw_vol" class="blue-input" value="28" oninput="gpFlowFromVol()"><span>kg/kmol</span><input id="gp_vol_flow" class="blue-input" value="16007" oninput="gpFlowFromVol()"><span>Nm³/hr</span></div>
                            <div class="gas-input-row"><label>→ Molar Flowrate</label><div class="gas-result" id="gp_molar_out2"><strong>714.2857</strong> kmol/hr</div></div>
                            <div class="gas-input-row"><label>→ Mass Flowrate</label><div class="gas-result" id="gp_mass_out2"><strong>20000.00</strong> kg/hr</div></div>
                            <div class="gas-input-row"><label>→ Mass Flowrate (lb/hr)</label><div class="gas-result" id="gp_mass_lb_out"><strong>44092.45</strong> lb/hr</div></div>
                        </div>
                        <div>
                            <h4>📏 Actual Volumetric Flowrate</h4>
                            <div class="gas-input-row"><label>Operating Pressure</label><input id="gp_act_p" class="blue-input" value="800" oninput="gpActualToNorm()"><span>kPa g</span><input id="gp_act_t" class="blue-input" value="308" oninput="gpActualToNorm()"><span>K</span><input id="gp_act_r" class="blue-input" value="1" oninput="gpActualToNorm()"><span>Ratio</span><input id="gp_act_vol" class="blue-input" value="100" oninput="gpActualToNorm()"><span>m³/hr</span></div>
                            <div class="gas-input-row"><label>→ Normal Vol Flow</label><div class="gas-result" id="gp_norm_out"><strong>--</strong> Nm³/hr</div></div>
                            <div class="gas-input-row"><label>→ Molar Flowrate</label><div class="gas-result" id="gp_molar_act_out"><strong>--</strong> kmol/hr</div></div>
                            <div class="gas-input-row"><label>→ MMSCFD</label><div class="gas-result" id="gp_mmcfd_out"><strong>--</strong> MMSCFD</div></div>
                            <hr>
                            <div class="gas-input-row"><label>Operating Pressure</label><input id="gp_norm_p" class="blue-input" value="800" oninput="gpNormToActual()"><span>kPa g</span><input id="gp_norm_t" class="blue-input" value="308" oninput="gpNormToActual()"><span>K</span><input id="gp_norm_r" class="blue-input" value="1" oninput="gpNormToActual()"><span>Ratio</span><input id="gp_norm_vol" class="blue-input" value="16007" oninput="gpNormToActual()"><span>Nm³/hr</span></div>
                            <div class="gas-input-row"><label>→ Actual Vol Flow</label><div class="gas-result" id="gp_actual_out"><strong>--</strong> m³/hr</div></div>
                            <div class="gas-input-row"><label>→ Molar Flowrate</label><div class="gas-result" id="gp_molar_norm_out"><strong>--</strong> kmol/hr</div></div>
                        </div>
                    </div>
                    <div style="margin-top:20px">
                        <h4>⚙️ Ideal Gas Law</h4>
                        <div class="gas-input-row"><label>Solve for</label><select id="gp_ideal_solve" onchange="gpIdealGas()"><option value="pressure">Pressure</option><option value="temperature">Temperature</option><option value="mass_flow">Mass Flowrate</option><option value="vol_flow">Volumetric Flowrate</option></select></div>
                        <div class="gas-input-row"><label>Pressure</label><input id="gp_ideal_p" class="blue-input" value="101.325" oninput="gpIdealGas()"><span>kPa a</span><input id="gp_ideal_t" class="blue-input" value="273" oninput="gpIdealGas()"><span>K</span></div>
                        <div class="gas-input-row"><label>Molecular Wt</label><input id="gp_ideal_mw" class="blue-input" value="28" oninput="gpIdealGas()"><span>kg/kmol</span><input id="gp_ideal_z" class="blue-input" value="0.997" oninput="gpIdealGas()"><span>Z Factor</span></div>
                        <div class="gas-input-row"><label>Mass Flow</label><input id="gp_ideal_mass" class="blue-input" value="1000" oninput="gpIdealGas()"><span>kg/hr</span><input id="gp_ideal_vol" class="blue-input" value="800" oninput="gpIdealGas()"><span>m³/hr</span></div>
                        <div class="gas-input-row"><label>→ Result</label><div class="gas-result" id="gp_ideal_result"><strong>--</strong></div></div>
                        <div class="gas-input-row"><label>Gas Constant</label><div class="gas-result"><strong>8.31447</strong> J/mol·K</div></div>
                    </div>
                </div>
                ` : ''}
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
            <div class="copyright">© 2024 Process Engineer's Tool. All rights reserved.</div>
        `;
    }

    function renderComingSoon(toolName) {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page coming-soon">
                <h2>🛠️ ${toolName}</h2>
                <p>Coming soon from your Excel data!</p>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
            <div class="copyright">© 2024 Process Engineer's Tool. All rights reserved.</div>
        `;
    }

    window.updateFromValue = function(v) { 
        inputVal = parseFloat(v) || 0; 
        updateDisplay();
    };
    window.updateFromUnit = function(u) { 
        fromUnit = u; 
        const cat = unitCategories[currentCat];
        const conv = getConversions();
        const preview = document.getElementById('previewResult');
        if (preview) preview.value = formatNumber(conv[toUnit]);
        // Update all result cards
        const list = cat.order;
        list.forEach(unit => {
            const card = document.getElementById(`result_${unit.replace(/[^a-zA-Z0-9]/g, '_')}`);
            if (card) card.innerHTML = formatNumber(conv[unit]);
        });
        if (currentCat === "gas_flow") {
            gpFlowFromMass(); gpFlowFromVol(); gpActualToNorm(); gpNormToActual(); gpIdealGas();
        }
    };
    window.updateToUnit = function(u) { 
        toUnit = u; 
        const conv = getConversions();
        const preview = document.getElementById('previewResult');
        if (preview) preview.value = formatNumber(conv[toUnit]);
    };
    window.swapUnits = function() { 
        let t = fromUnit; 
        fromUnit = toUnit; 
        toUnit = t; 
        const fromSelect = document.getElementById('fromUnitSelect');
        const toSelect = document.getElementById('toUnitSelect');
        if (fromSelect) fromSelect.value = fromUnit;
        if (toSelect) toSelect.value = toUnit;
        updateFromValue(document.getElementById('fromValueInput')?.value || 1);
    };
    window.selectTool = function(id) { 
        currentView = id; 
        if (id === "unit_converter") { 
            currentCat = "length"; 
            fromUnit = "meter"; 
            toUnit = "kilometer"; 
            inputVal = 1; 
        } 
        renderApp(); 
    };
    window.goBack = function() { currentView = "dashboard"; renderApp(); };
    window.switchCat = function(cat) { 
        currentCat = cat; 
        const catObj = unitCategories[cat]; 
        fromUnit = catObj.order[0]; 
        toUnit = catObj.order[1] || catObj.order[0]; 
        inputVal = 1; 
        renderApp(); 
    };

    function renderApp() {
        if (isRendering) return;
        isRendering = true;
        const app = document.getElementById("app");
        if (currentView === "dashboard") app.innerHTML = renderDashboard();
        else if (currentView === "unit_converter") app.innerHTML = renderUnitConverter();
        else app.innerHTML = renderComingSoon(tools.find(t => t.id === currentView)?.name || "Engineering Tool");
        
        if (currentView === "unit_converter") {
            setTimeout(() => {
                const inp = document.getElementById("fromValueInput");
                if (inp) inp.value = inputVal;
                if (currentCat === "gas_flow") {
                    gpFlowFromMass(); gpFlowFromVol(); gpActualToNorm(); gpNormToActual(); gpIdealGas();
                }
            }, 50);
        }
        isRendering = false;
    }
    renderApp();
</script>
</body>
</html>
