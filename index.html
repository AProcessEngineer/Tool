<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google-site-verification" content="pLzoZiJTZLKHLwS9LkGWCiKIUB98ZtE8PqpDrAy6ASA" />
    <meta name="description" content="Professional process engineering toolkit for oil & gas industry" />
    <title>Process Engineer's Tool - Oil & Gas Engineering Toolkit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2e5c 0%, #0a4c6e 100%);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; padding: 20px; }
        .header h1 { font-size: 2.5rem; color: white; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
        .header h1 span { color: #ff9800; }
        .header p { color: #b8d4f0; font-size: 1.1rem; margin-top: 10px; }
        .footer-quote { text-align: center; margin-top: 50px; padding: 20px; border-top: 1px solid rgba(255,255,255,0.2); color: #ff9800; font-style: italic; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .tool-card {
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 28px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .tool-card:hover { transform: translateY(-8px); background: white; border-color: #ff9800; }
        .tool-icon { font-size: 3rem; margin-bottom: 15px; }
        .tool-title { font-size: 1.3rem; font-weight: 700; color: #0a2e5c; }
        .tool-desc { font-size: 0.85rem; color: #666; margin-top: 8px; }
        .back-btn {
            background: #ff9800; color: #1a2a3a; border: none; padding: 12px 24px;
            border-radius: 40px; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-bottom: 25px; display: inline-flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { background: #e68900; transform: translateX(-5px); }
        .tool-page { background: white; border-radius: 24px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        
        /* Gas Phase Calculator Styles */
        .gas-calculator { background: white; border-radius: 20px; overflow: hidden; }
        .gas-section { margin-bottom: 30px; border: 1px solid #e0e0e0; border-radius: 16px; overflow: hidden; }
        .section-header { background: #0a2e5c; color: white; padding: 15px 20px; font-size: 1.2rem; font-weight: bold; }
        .gas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .gas-card { background: #f8f9fa; border-radius: 12px; padding: 20px; border-left: 4px solid #ff9800; }
        .gas-card h3 { color: #0a2e5c; margin-bottom: 15px; font-size: 1rem; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
        .input-row { margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .input-row label { width: 140px; font-size: 0.85rem; font-weight: 500; color: #555; }
        .input-row input, .input-row select { flex: 1; min-width: 120px; padding: 8px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 0.9rem; }
        .input-row input:focus { outline: none; border-color: #ff9800; }
        .input-row .unit-hint { font-size: 0.7rem; color: #888; width: 50px; }
        .result-value { font-weight: bold; color: #0a2e5c; background: #e8f0fe; padding: 8px 12px; border-radius: 8px; flex: 1; }
        .blue-input { background: #e3f2fd !important; border-color: #2196f3 !important; }
        .note { font-size: 0.7rem; color: #888; margin-top: 5px; font-style: italic; }
        hr { margin: 15px 0; border: none; border-top: 1px solid #ddd; }
        .inline-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            .gas-grid { grid-template-columns: 1fr; }
            .input-row { flex-direction: column; align-items: flex-start; }
            .input-row label { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
    let currentView = "dashboard";

    const tools = [
        { id: "unit_converter", icon: "📐", name: "Unit Conversion", desc: "60+ engineering unit categories" },
        { id: "gas_phase", icon: "🔥", name: "Gas Phase Calculator", desc: "Flowrate, volumetric flow, ideal gas law" },
        { id: "mathematical", icon: "🧮", name: "Mathematical Calculation", desc: "Interpolation, geometry, circle, cylinder" },
        { id: "line_sizing", icon: "📏", name: "Line Sizing", desc: "Liquid, gas & multiphase flow" },
        { id: "psv_sizing", icon: "🔥", name: "PSV Sizing", desc: "Fire case, blocked discharge" },
        { id: "pump_sizing", icon: "🌀", name: "Pump Sizing", desc: "Pump duty, NPSH calculation" },
        { id: "reference", icon: "📚", name: "Reference", desc: "Pipe thickness, orifice areas" }
    ];

    function renderDashboard() {
        return `
            <div class="header"><h1><span>🛠️</span> Process Engineer's Tool</h1><p>Oil & Gas</p></div>
            <div class="dashboard-grid">${tools.map(tool => `<div class="tool-card" onclick="selectTool('${tool.id}')"><div class="tool-icon">${tool.icon}</div><div class="tool-title">${tool.name}</div><div class="tool-desc">${tool.desc}</div></div>`).join('')}</div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
        `;
    }

    // ==================== GAS PHASE CALCULATOR ====================
    function calculateFlowrateFromMass() {
        const mw = parseFloat(document.getElementById('flow_mw_mass')?.value) || 0;
        const massFlow = parseFloat(document.getElementById('flow_mass_flow')?.value) || 0;
        if (mw > 0 && massFlow > 0) {
            const molarFlow = massFlow / mw;
            const volFlow = molarFlow * 22.414;
            document.getElementById('flow_molar_result').innerHTML = `<strong>${molarFlow.toFixed(4)}</strong> <span style="font-size:0.7rem;">kmol/hr</span>`;
            document.getElementById('flow_vol_result').innerHTML = `<strong>${volFlow.toFixed(2)}</strong> <span style="font-size:0.7rem;">Nm³/hr</span>`;
        }
    }

    function calculateFlowrateFromVol() {
        const mw = parseFloat(document.getElementById('flow_mw_vol')?.value) || 0;
        const volFlow = parseFloat(document.getElementById('flow_vol_flow')?.value) || 0;
        if (mw > 0 && volFlow > 0) {
            const molarFlow = volFlow / 22.414;
            const massFlow = molarFlow * mw;
            document.getElementById('flow_molar_result2').innerHTML = `<strong>${molarFlow.toFixed(4)}</strong> <span style="font-size:0.7rem;">kmol/hr</span>`;
            document.getElementById('flow_mass_result2').innerHTML = `<strong>${massFlow.toFixed(2)}</strong> <span style="font-size:0.7rem;">kg/hr</span>`;
        }
    }

    function calculateActualFromPressure() {
        const opPressure = parseFloat(document.getElementById('actual_op_pressure')?.value) || 0;
        const opTemp = parseFloat(document.getElementById('actual_op_temp')?.value) || 0;
        const compRatio = parseFloat(document.getElementById('actual_comp_ratio')?.value) || 1;
        const actualVol = parseFloat(document.getElementById('actual_vol_flow')?.value) || 0;
        if (opPressure > 0 && opTemp > 0 && actualVol > 0) {
            const stdPressure = 101.325;
            const stdTemp = 273.15;
            const normVol = actualVol * (opPressure / stdPressure) * (stdTemp / opTemp) * compRatio;
            const molarFlow = normVol / 22.414;
            document.getElementById('actual_norm_result').innerHTML = `<strong>${normVol.toFixed(2)}</strong> <span style="font-size:0.7rem;">Nm³/hr</span>`;
            document.getElementById('actual_molar_result').innerHTML = `<strong>${molarFlow.toFixed(4)}</strong> <span style="font-size:0.7rem;">kmol/hr</span>`;
        }
    }

    function calculateActualFromNorm() {
        const opPressure = parseFloat(document.getElementById('actual2_op_pressure')?.value) || 0;
        const opTemp = parseFloat(document.getElementById('actual2_op_temp')?.value) || 0;
        const compRatio = parseFloat(document.getElementById('actual2_comp_ratio')?.value) || 1;
        const normVol = parseFloat(document.getElementById('actual2_norm_flow')?.value) || 0;
        if (opPressure > 0 && opTemp > 0 && normVol > 0) {
            const stdPressure = 101.325;
            const stdTemp = 273.15;
            const actualVol = normVol * (stdPressure / opPressure) * (opTemp / stdTemp) / compRatio;
            const molarFlow = normVol / 22.414;
            document.getElementById('actual2_actual_result').innerHTML = `<strong>${actualVol.toFixed(2)}</strong> <span style="font-size:0.7rem;">m³/hr</span>`;
            document.getElementById('actual2_molar_result').innerHTML = `<strong>${molarFlow.toFixed(4)}</strong> <span style="font-size:0.7rem;">kmol/hr</span>`;
        }
    }

    function calculateIdealGas() {
        const solveFor = document.getElementById('ideal_solve_for')?.value;
        const pressure = parseFloat(document.getElementById('ideal_pressure')?.value) || 0;
        const temp = parseFloat(document.getElementById('ideal_temp')?.value) || 0;
        const mw = parseFloat(document.getElementById('ideal_mw')?.value) || 0;
        const massFlow = parseFloat(document.getElementById('ideal_mass_flow')?.value) || 0;
        const volFlow = parseFloat(document.getElementById('ideal_vol_flow')?.value) || 0;
        const z = parseFloat(document.getElementById('ideal_z')?.value) || 1;
        const R = 8.31447;
        
        if (solveFor === "pressure" && temp > 0 && mw > 0 && volFlow > 0 && z > 0) {
            const pressureCalc = (volFlow * R * temp * z) / (mw * 22.414 / 101.325);
            document.getElementById('ideal_pressure_result').innerHTML = `<strong>${pressureCalc.toFixed(2)}</strong> <span style="font-size:0.7rem;">kPa a</span>`;
        }
        if (solveFor === "temperature" && pressure > 0 && mw > 0 && volFlow > 0 && z > 0) {
            const tempCalc = (pressure * mw * 22.414) / (volFlow * R * z / 101.325);
            document.getElementById('ideal_temp_result').innerHTML = `<strong>${tempCalc.toFixed(2)}</strong> <span style="font-size:0.7rem;">K</span>`;
        }
        if (solveFor === "mass_flow" && pressure > 0 && temp > 0 && mw > 0 && volFlow > 0 && z > 0) {
            const massFlowCalc = (pressure * mw * volFlow) / (R * temp * z / 101.325 * 1000);
            document.getElementById('ideal_mass_result').innerHTML = `<strong>${massFlowCalc.toFixed(2)}</strong> <span style="font-size:0.7rem;">kg/hr</span>`;
        }
        if (solveFor === "vol_flow" && pressure > 0 && temp > 0 && mw > 0 && massFlow > 0 && z > 0) {
            const volFlowCalc = (massFlow * R * temp * z) / (pressure * mw * 1000 / 101.325);
            document.getElementById('ideal_vol_result').innerHTML = `<strong>${volFlowCalc.toFixed(2)}</strong> <span style="font-size:0.7rem;">m³/hr</span>`;
        }
    }

    function renderGasPhaseCalculator() {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page">
                <h2 style="color:#0a2e5c; margin-bottom:20px;">🔥 Gas Phase Calculator</h2>
                
                <!-- Section 1: Flowrate -->
                <div class="gas-section">
                    <div class="section-header">📊 Flowrate Calculations</div>
                    <div class="gas-grid">
                        <div class="gas-card">
                            <h3>From Molecular Weight + Mass Flowrate</h3>
                            <div class="input-row"><label>Molecular Weight (MW)</label><input type="number" id="flow_mw_mass" class="blue-input" value="28" step="any" oninput="calculateFlowrateFromMass()"><span class="unit-hint">kg/kmol</span></div>
                            <div class="input-row"><label>Mass Flowrate</label><input type="number" id="flow_mass_flow" class="blue-input" value="20000" step="any" oninput="calculateFlowrateFromMass()"><span class="unit-hint">kg/hr</span></div>
                            <div class="input-row"><label>→ Molar Flowrate</label><div class="result-value" id="flow_molar_result"><strong>714.2857</strong> <span style="font-size:0.7rem;">kmol/hr</span></div></div>
                            <div class="input-row"><label>→ Volumetric Flowrate</label><div class="result-value" id="flow_vol_result"><strong>16007.14</strong> <span style="font-size:0.7rem;">Nm³/hr</span></div></div>
                        </div>
                        <div class="gas-card">
                            <h3>From Molecular Weight + Volumetric Flowrate</h3>
                            <div class="input-row"><label>Molecular Weight (MW)</label><input type="number" id="flow_mw_vol" class="blue-input" value="28" step="any" oninput="calculateFlowrateFromVol()"><span class="unit-hint">kg/kmol</span></div>
                            <div class="input-row"><label>Volumetric Flowrate</label><input type="number" id="flow_vol_flow" class="blue-input" value="16007" step="any" oninput="calculateFlowrateFromVol()"><span class="unit-hint">Nm³/hr</span></div>
                            <div class="input-row"><label>→ Molar Flowrate</label><div class="result-value" id="flow_molar_result2"><strong>714.2857</strong> <span style="font-size:0.7rem;">kmol/hr</span></div></div>
                            <div class="input-row"><label>→ Mass Flowrate</label><div class="result-value" id="flow_mass_result2"><strong>20000.00</strong> <span style="font-size:0.7rem;">kg/hr</span></div></div>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Actual Volumetric Flowrate -->
                <div class="gas-section">
                    <div class="section-header">📏 Actual Volumetric Flowrate</div>
                    <div class="gas-grid">
                        <div class="gas-card">
                            <h3>From Actual → Normal Conditions</h3>
                            <div class="input-row"><label>Operating Pressure</label><input type="number" id="actual_op_pressure" class="blue-input" value="800" step="any" oninput="calculateActualFromPressure()"><span class="unit-hint">kPa g</span></div>
                            <div class="input-row"><label>Operating Temperature</label><input type="number" id="actual_op_temp" class="blue-input" value="308" step="any" oninput="calculateActualFromPressure()"><span class="unit-hint">K</span></div>
                            <div class="input-row"><label>Compression Ratio</label><input type="number" id="actual_comp_ratio" class="blue-input" value="1" step="any" oninput="calculateActualFromPressure()"><span class="unit-hint">-</span></div>
                            <div class="input-row"><label>Actual Volumetric Flowrate</label><input type="number" id="actual_vol_flow" class="blue-input" value="100" step="any" oninput="calculateActualFromPressure()"><span class="unit-hint">m³/hr</span></div>
                            <div class="input-row"><label>→ Normal Volumetric Flowrate</label><div class="result-value" id="actual_norm_result"><strong>--</strong> <span style="font-size:0.7rem;">Nm³/hr</span></div></div>
                            <div class="input-row"><label>→ Molar Flowrate</label><div class="result-value" id="actual_molar_result"><strong>--</strong> <span style="font-size:0.7rem;">kmol/hr</span></div></div>
                        </div>
                        <div class="gas-card">
                            <h3>From Normal → Actual Conditions</h3>
                            <div class="input-row"><label>Operating Pressure</label><input type="number" id="actual2_op_pressure" class="blue-input" value="800" step="any" oninput="calculateActualFromNorm()"><span class="unit-hint">kPa g</span></div>
                            <div class="input-row"><label>Operating Temperature</label><input type="number" id="actual2_op_temp" class="blue-input" value="308" step="any" oninput="calculateActualFromNorm()"><span class="unit-hint">K</span></div>
                            <div class="input-row"><label>Compression Ratio</label><input type="number" id="actual2_comp_ratio" class="blue-input" value="1" step="any" oninput="calculateActualFromNorm()"><span class="unit-hint">-</span></div>
                            <div class="input-row"><label>Normal Volumetric Flowrate</label><input type="number" id="actual2_norm_flow" class="blue-input" value="16007" step="any" oninput="calculateActualFromNorm()"><span class="unit-hint">Nm³/hr</span></div>
                            <div class="input-row"><label>→ Actual Volumetric Flowrate</label><div class="result-value" id="actual2_actual_result"><strong>--</strong> <span style="font-size:0.7rem;">m³/hr</span></div></div>
                            <div class="input-row"><label>→ Molar Flowrate</label><div class="result-value" id="actual2_molar_result"><strong>--</strong> <span style="font-size:0.7rem;">kmol/hr</span></div></div>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Ideal Gas Law -->
                <div class="gas-section">
                    <div class="section-header">⚙️ Ideal Gas Law</div>
                    <div class="gas-grid">
                        <div class="gas-card">
                            <h3>Solve for Variable</h3>
                            <div class="input-row"><label>Solve for</label><select id="ideal_solve_for" class="blue-input" oninput="calculateIdealGas()" onchange="calculateIdealGas()"><option value="pressure">Pressure</option><option value="temperature">Temperature</option><option value="mass_flow">Mass Flowrate</option><option value="vol_flow">Volumetric Flowrate</option></select></div>
                            <div class="input-row"><label>Pressure</label><input type="number" id="ideal_pressure" value="101.325" step="any" oninput="calculateIdealGas()"><span class="unit-hint">kPa a</span></div>
                            <div class="input-row"><label>Temperature</label><input type="number" id="ideal_temp" value="273" step="any" oninput="calculateIdealGas()"><span class="unit-hint">K</span></div>
                            <div class="input-row"><label>Molecular Weight</label><input type="number" id="ideal_mw" value="28" step="any" oninput="calculateIdealGas()"><span class="unit-hint">kg/kmol</span></div>
                            <div class="input-row"><label>Mass Flowrate</label><input type="number" id="ideal_mass_flow" value="1000" step="any" oninput="calculateIdealGas()"><span class="unit-hint">kg/hr</span></div>
                            <div class="input-row"><label>Volumetric Flowrate</label><input type="number" id="ideal_vol_flow" value="800" step="any" oninput="calculateIdealGas()"><span class="unit-hint">m³/hr</span></div>
                            <div class="input-row"><label>Z Factor</label><input type="number" id="ideal_z" value="0.997" step="any" oninput="calculateIdealGas()"><span class="unit-hint">-</span></div>
                            <hr>
                            <div class="input-row"><label>→ Result</label><div class="result-value" id="ideal_pressure_result"><strong>--</strong> <span style="font-size:0.7rem;"></span></div></div>
                            <div class="input-row"><label>→ Gas Constant</label><div class="result-value"><strong>8.31447</strong> <span style="font-size:0.7rem;">J/mol·K</span></div></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
        `;
    }

    function renderComingSoon(toolName) {
        return `<button class="back-btn" onclick="goBack()">← Back to Dashboard</button><div class="tool-page coming-soon"><h2>🛠️ ${toolName}</h2><p>Coming soon from your Excel data!</p></div><div class="footer-quote">"Built by one. Scaled by intelligence"</div>`;
    }

    window.selectTool = function(id) { 
        currentView = id; 
        renderApp(); 
        if (id === "gas_phase") {
            setTimeout(() => {
                calculateFlowrateFromMass();
                calculateFlowrateFromVol();
                calculateActualFromPressure();
                calculateActualFromNorm();
                calculateIdealGas();
            }, 50);
        }
    };
    window.goBack = function() { currentView = "dashboard"; renderApp(); };

    function renderApp() {
        const app = document.getElementById("app");
        if (currentView === "dashboard") app.innerHTML = renderDashboard();
        else if (currentView === "gas_phase") app.innerHTML = renderGasPhaseCalculator();
        else if (currentView === "unit_converter") app.innerHTML = renderComingSoon("Unit Conversion (Coming with 60+ categories)");
        else { const tool = tools.find(t => t.id === currentView); app.innerHTML = renderComingSoon(tool ? tool.name : "Engineering Tool"); }
    }
    renderApp();
</script>
</body>
</html>
