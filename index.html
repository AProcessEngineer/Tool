<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google-site-verification" content="pLzoZiJTZLKHLwS9LkGWCiKIUB98ZtE8PqpDrAy6ASA" />
    <meta name="description" content="Professional unit converter for process engineers in oil & gas, offshore/onshore, piping, and hydraulics. Convert 40+ categories including pressure, temperature, flow, viscosity, energy, and power." />
    <title>Process Engineer's Complete Unit Converter</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0a2e5c 0%, #0a4c6e 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            text-align: center;
            color: #b8d4f0;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .cat-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 8px 14px;
            border-radius: 25px;
            color: white;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .cat-btn.active {
            background: #ff9800;
            color: #1a2a3a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .converter-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0a2e5c;
            margin: 0 0 5px 0;
        }
        .category-sub {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .value-input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-family: monospace;
            transition: border 0.2s;
        }
        .value-input:focus {
            outline: none;
            border-color: #ff9800;
        }
        .unit-select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
        }
        .swap-btn {
            background: #0a2e5c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            font-weight: 600;
        }
        .result {
            background: #f0f4f8;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .result-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: #0a2e5c;
            word-break: break-word;
        }
        .result-unit {
            font-size: 1rem;
            color: #ff9800;
        }
        .footer {
            text-align: center;
            color: #b8d4f0;
            font-size: 0.7rem;
            margin-top: 20px;
        }
        @media (max-width: 550px) {
            body { padding: 12px; }
            .cat-btn { padding: 6px 10px; font-size: 0.65rem; }
            .converter-card { padding: 18px; }
            .result-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🛠️ Process Engineer's Tool</h1>
    <div class="subtitle">Oil & Gas | Offshore/Onshore | Piping & Hydraulics</div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="converter-card">
        <div class="category-title" id="catTitle">Length</div>
        <div class="category-sub" id="catSub">Convert between different units of measurement</div>

        <div class="input-group">
            <label>📥 From</label>
            <input type="number" id="fromValue" class="value-input" value="1" step="any" placeholder="Enter value">
        </div>

        <div class="input-group">
            <label>📤 From Unit</label>
            <select id="fromUnit" class="unit-select"></select>
        </div>

        <button class="swap-btn" id="swapBtn">⇅ Swap Units</button>

        <div class="input-group">
            <label>🎯 To Unit</label>
            <select id="toUnit" class="unit-select"></select>
        </div>

        <div class="result">
            <div class="result-label">Converted Value</div>
            <div class="result-value" id="resultValue">1.0000</div>
            <div class="result-unit" id="resultUnit">meter</div>
        </div>
    </div>
    <div class="footer">⚙️ 40+ Engineering Categories | Real-time Conversion | High Precision</div>
</div>

<script>
    // ==================== COMPLETE CONVERSION DATABASE FROM YOUR EXCEL ====================
    const conversionData = {
        length: {
            name: "📏 Length",
            units: {
                "meter": 1, "kilometer": 0.001, "centimeter": 100, "millimeter": 1000,
                "mile": 0.000621371, "yard": 1.09361, "foot": 3.28084, "inch": 39.3701,
                "nautical mile": 0.000539957
            }
        },
        pressure_gauge: {
            name: "⚡ Pressure (Gauge)",
            units: {
                "bar g": 1, "atm g": 0.986923, "Pa g": 100000, "kPa g": 100,
                "kg/cm² g": 1.01972, "psi g": 14.5038, "mmHg g": 750.062, "mmH₂O g": 10197.2
            }
        },
        pressure_absolute: {
            name: "⚡ Pressure (Absolute)",
            units: {
                "bar a": 1, "atm a": 0.986923, "Pa a": 100000, "kPa a": 100,
                "kg/cm² a": 1.01972, "psi a": 14.5038, "mmHg a": 750.062, "mmH₂O a": 10197.2
            }
        },
        temperature: {
            name: "🌡️ Temperature",
            isSpecial: true,
            convert: (val, from, to) => {
                let c;
                if (from === "Celsius") c = val;
                else if (from === "Fahrenheit") c = (val - 32) * 5/9;
                else if (from === "Kelvin") c = val - 273.15;
                else if (from === "Rankine") c = (val - 491.67) * 5/9;
                else c = val;
                
                if (to === "Celsius") return c;
                if (to === "Fahrenheit") return c * 9/5 + 32;
                if (to === "Kelvin") return c + 273.15;
                if (to === "Rankine") return (c + 273.15) * 9/5;
                return c;
            },
            units: ["Celsius", "Fahrenheit", "Kelvin", "Rankine"]
        },
        volumetric_flow: {
            name: "💧 Volumetric Flow",
            units: {
                "m³/hr": 1, "m³/day": 24, "ft³/hr": 35.3147, "ft³/day": 847.552,
                "L/min": 16.6667, "US GPM": 4.4029, "BLPD": 150.955, "kLPD": 24,
                "Nm³/hr": 1, "Sm³/hr": 1.057, "MMSCFD": 0.0008958
            }
        },
        mass_flow: {
            name: "⚖️ Mass Flow",
            units: {
                "kg/hr": 1, "kg/s": 0.00027778, "lb/hr": 2.20462, "lb/s": 0.0006124,
                "ton/hr": 0.001, "g/s": 0.27778
            }
        },
        volume: {
            name: "🧴 Volume",
            units: {
                "m³": 1, "liter": 1000, "cm³": 1000000, "ft³": 35.3147,
                "in³": 61023.7, "gallon (US)": 264.172, "barrel": 6.2898
            }
        },
        mass: {
            name: "⚖️ Mass",
            units: {
                "kg": 1, "g": 1000, "mg": 1000000, "lb": 2.20462,
                "ton (metric)": 0.001, "ton (US)": 0.0011023, "ton (UK)": 0.0009842,
                "Newton": 9.80665
            }
        },
        density: {
            name: "🎯 Density",
            units: {
                "kg/m³": 1, "g/cm³": 0.001, "kg/L": 0.001, "g/L": 1,
                "lb/ft³": 0.06243, "lb/gal (US)": 0.008345, "SG (60°F)": 0.001,
                "ppm": 1000
            }
        },
        dynamic_viscosity: {
            name: "🔄 Dynamic Viscosity",
            units: {
                "Pa·s": 1, "cP": 1000, "N·s/m²": 1, "kg/m·s": 1,
                "g/cm·s": 10, "lb/ft·s": 0.672, "lbf·s/ft²": 0.020885
            }
        },
        kinematic_viscosity: {
            name: "🌊 Kinematic Viscosity",
            units: {
                "m²/s": 1, "cSt": 1000000, "Stokes": 10000, "cm²/s": 10000,
                "ft²/s": 10.7639, "in²/s": 1550
            }
        },
        energy: {
            name: "⚡ Energy",
            units: {
                "Joule": 1, "kJ": 0.001, "Calorie": 0.239006, "kCal": 0.000239,
                "BTU": 0.0009478, "Wh": 0.00027778, "kWh": 2.7778e-7
            }
        },
        power: {
            name: "💪 Power",
            units: {
                "Watt": 1, "kW": 0.001, "MW": 1e-6, "hp": 0.001341,
                "BTU/hr": 3.41214, "J/hr": 3600, "kJ/hr": 3.6, "kCal/hr": 0.8598
            }
        },
        area: {
            name: "📐 Area",
            units: {
                "m²": 1, "cm²": 10000, "mm²": 1e6, "ft²": 10.7639,
                "in²": 1550, "acre": 0.0002471, "hectare": 0.0001
            }
        },
        velocity: {
            name: "🏃 Velocity",
            units: {
                "m/s": 1, "ft/s": 3.28084, "km/h": 3.6, "mph": 2.23694,
                "knot": 1.94384, "mach": 0.0029386
            }
        },
        acceleration: {
            name: "📈 Acceleration",
            units: {
                "m/s²": 1, "cm/s²": 100, "ft/s²": 3.28084, "in/s²": 39.3701,
                "G force": 0.101972
            }
        },
        specific_heat: {
            name: "🔥 Specific Heat",
            units: {
                "J/kg·K": 1, "kJ/kg·K": 0.001, "kcal/kg·°C": 0.0002388,
                "Btu/lb·°F": 0.0002388, "J/kg·°C": 1
            }
        },
        thermal_conductivity: {
            name: "🌡️ Thermal Conductivity",
            units: {
                "W/m·K": 1, "W/m·°C": 1, "kcal/hr·m·°C": 0.859845,
                "Btu/hr·ft·°F": 0.577789, "kJ/hr·m·°C": 3.6
            }
        }
    };

    let currentCategory = "length";
    let currentUnits = {};

    // Build category list from conversionData
    const categoryList = Object.keys(conversionData).map(key => ({
        id: key,
        name: conversionData[key].name
    }));

    // Render category tabs
    function renderTabs() {
        const container = document.getElementById("categoryTabs");
        container.innerHTML = categoryList.map(cat => `
            <button class="cat-btn ${cat.id === currentCategory ? 'active' : ''}" data-cat="${cat.id}">
                ${cat.name}
            </button>
        `).join("");
        
        document.querySelectorAll(".cat-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                currentCategory = btn.dataset.cat;
                renderTabs();
                updateConverterForCategory();
                convert();
            });
        });
    }

    // Update UI for selected category
    function updateConverterForCategory() {
        const cat = conversionData[currentCategory];
        document.getElementById("catTitle").innerHTML = cat.name;
        document.getElementById("catSub").innerHTML = `Convert between ${cat.name.toLowerCase()} units`;
        
        let unitList = [];
        if (cat.isSpecial) {
            unitList = cat.units;
        } else {
            unitList = Object.keys(cat.units);
        }
        
        const fromSelect = document.getElementById("fromUnit");
        const toSelect = document.getElementById("toUnit");
        
        fromSelect.innerHTML = unitList.map(u => `<option value="${u}">${u}</option>`).join("");
        toSelect.innerHTML = unitList.map(u => `<option value="${u}">${u}</option>`).join("");
        
        // Set defaults
        if (unitList[0]) {
            if (!currentUnits[currentCategory]) {
                currentUnits[currentCategory] = { from: unitList[0], to: unitList[Math.min(1, unitList.length-1)] };
            }
            fromSelect.value = currentUnits[currentCategory].from || unitList[0];
            toSelect.value = currentUnits[currentCategory].to || unitList[Math.min(1, unitList.length-1)];
        }
    }

    // Perform conversion
    function convert() {
        const fromVal = parseFloat(document.getElementById("fromValue").value);
        if (isNaN(fromVal)) {
            document.getElementById("resultValue").innerText = "Invalid";
            return;
        }
        
        const fromUnit = document.getElementById("fromUnit").value;
        const toUnit = document.getElementById("toUnit").value;
        
        // Save current selection
        currentUnits[currentCategory] = { from: fromUnit, to: toUnit };
        
        const cat = conversionData[currentCategory];
        let result;
        
        if (cat.isSpecial) {
            result = cat.convert(fromVal, fromUnit, toUnit);
        } else {
            const baseValue = fromVal / cat.units[fromUnit];
            result = baseValue * cat.units[toUnit];
        }
        
        document.getElementById("resultValue").innerText = result.toFixed(6);
        document.getElementById("resultUnit").innerHTML = toUnit;
    }

    // Swap units
    function swapUnits() {
        const fromSelect = document.getElementById("fromUnit");
        const toSelect = document.getElementById("toUnit");
        const fromVal = fromSelect.value;
        const toVal = toSelect.value;
        fromSelect.value = toVal;
        toSelect.value = fromVal;
        currentUnits[currentCategory] = { from: toVal, to: fromVal };
        convert();
    }

    // Event listeners
    document.getElementById("fromValue").addEventListener("input", convert);
    document.getElementById("fromUnit").addEventListener("change", () => {
        currentUnits[currentCategory].from = document.getElementById("fromUnit").value;
        convert();
    });
    document.getElementById("toUnit").addEventListener("change", () => {
        currentUnits[currentCategory].to = document.getElementById("toUnit").value;
        convert();
    });
    document.getElementById("swapBtn").addEventListener("click", swapUnits);

    // Initialize
    renderTabs();
    updateConverterForCategory();
    convert();
</script>
</body>
</html>
