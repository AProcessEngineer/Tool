<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google-site-verification" content="pLzoZiJTZLKHLwS9LkGWCiKIUB98ZtE8PqpDrAy6ASA" />
    <meta name="description" content="Professional process engineering toolkit for oil & gas industry including unit conversion, line sizing, PSV sizing, pump sizing, heat exchanger design and more." />
    <title>Process Engineer's Tool - Oil & Gas Engineering Toolkit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://img.freepik.com/free-photo/aerial-view-oil-refinery-plant_335224-104.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        /* Overlay for readability */
        .overlay {
            background: linear-gradient(135deg, rgba(10, 46, 92, 0.92) 0%, rgba(10, 76, 110, 0.92) 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .header h1 span {
            color: #ff9800;
        }

        .header p {
            color: #b8d4f0;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .tool-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .tool-card:hover {
            transform: translateY(-8px);
            background: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border-color: #ff9800;
        }

        .tool-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .tool-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0a2e5c;
            margin-bottom: 10px;
        }

        .tool-desc {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.4;
        }

        /* Back Button */
        .back-btn {
            background: #ff9800;
            color: #1a2a3a;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #e68900;
            transform: translateX(-5px);
        }

        /* Unit Converter Page */
        .converter-page, .tool-page {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 15px;
        }

        .cat-tab {
            background: #f0f4f8;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .cat-tab.active {
            background: #0a2e5c;
            color: white;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .value-input {
            width: 100%;
            padding: 15px;
            font-size: 1.3rem;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-family: monospace;
        }

        .value-input:focus {
            outline: none;
            border-color: #ff9800;
        }

        /* All Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border-left: 4px solid #ff9800;
        }

        .result-card .value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0a2e5c;
        }

        .result-card .unit {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0a2e5c;
            margin: 20px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff9800;
        }

        /* Placeholder for other tools */
        .coming-soon {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .coming-soon h2 {
            color: #0a2e5c;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            .dashboard-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
            .results-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }
    </style>
</head>
<body>
<div class="overlay">
    <div class="container" id="app">
        <!-- Dashboard will be rendered here -->
    </div>
</div>

<script>
    // Unit definitions for ALL categories
    const unitCategories = {
        length: {
            name: "📏 Length",
            units: {
                "meter": 1,
                "kilometer": 0.001,
                "centimeter": 100,
                "millimeter": 1000,
                "mile": 0.000621371,
                "yard": 1.09361,
                "foot": 3.28084,
                "inch": 39.3701
            },
            displayOrder: ["meter", "kilometer", "centimeter", "millimeter", "mile", "yard", "foot", "inch"]
        },
        pressure: {
            name: "⚡ Pressure",
            units: {
                "bar": 1,
                "psi": 14.5038,
                "kPa": 100,
                "MPa": 0.1,
                "atm": 0.986923,
                "kg/cm²": 1.01972,
                "Pa": 100000,
                "mmHg": 750.062
            },
            displayOrder: ["bar", "psi", "kPa", "MPa", "atm", "kg/cm²", "Pa", "mmHg"]
        },
        temperature: {
            name: "🌡️ Temperature",
            isSpecial: true,
            convert: (val, from, to) => {
                let c;
                if (from === "°C") c = val;
                else if (from === "°F") c = (val - 32) * 5/9;
                else if (from === "K") c = val - 273.15;
                else if (from === "°R") c = (val - 491.67) * 5/9;
                else c = val;
                if (to === "°C") return c;
                if (to === "°F") return c * 9/5 + 32;
                if (to === "K") return c + 273.15;
                if (to === "°R") return (c + 273.15) * 9/5;
                return c;
            },
            units: ["°C", "°F", "K", "°R"],
            displayOrder: ["°C", "°F", "K", "°R"]
        },
        volumetric_flow: {
            name: "💧 Volumetric Flow",
            units: {
                "m³/hr": 1,
                "m³/day": 24,
                "L/min": 16.6667,
                "US GPM": 4.4029,
                "BLPD": 150.955,
                "ft³/hr": 35.3147,
                "MMSCFD": 0.0008958
            },
            displayOrder: ["m³/hr", "m³/day", "L/min", "US GPM", "BLPD", "ft³/hr", "MMSCFD"]
        },
        mass_flow: {
            name: "⚖️ Mass Flow",
            units: {
                "kg/hr": 1,
                "kg/s": 0.00027778,
                "lb/hr": 2.20462,
                "lb/s": 0.0006124
            },
            displayOrder: ["kg/hr", "kg/s", "lb/hr", "lb/s"]
        },
        density: {
            name: "🎯 Density",
            units: {
                "kg/m³": 1,
                "g/cm³": 0.001,
                "lb/ft³": 0.06243,
                "SG": 0.001
            },
            displayOrder: ["kg/m³", "g/cm³", "lb/ft³", "SG"]
        },
        viscosity: {
            name: "🔄 Viscosity",
            units: {
                "cP": 1000,
                "Pa·s": 1,
                "lb/ft·s": 0.672
            },
            displayOrder: ["cP", "Pa·s", "lb/ft·s"]
        },
        power: {
            name: "💪 Power",
            units: {
                "kW": 1,
                "MW": 0.001,
                "hp": 1.34102,
                "W": 1000
            },
            displayOrder: ["kW", "MW", "hp", "W"]
        },
        area: {
            name: "📐 Area",
            units: {
                "m²": 1,
                "ft²": 10.7639,
                "in²": 1550
            },
            displayOrder: ["m²", "ft²", "in²"]
        }
    };

    let currentView = "dashboard";
    let currentCategory = "length";
    let currentInputValue = 1;

    // Tools list from your Excel
    const tools = [
        { id: "unit_converter", icon: "📐", name: "Unit Conversion", desc: "40+ engineering unit categories" },
        { id: "mathematical", icon: "🧮", name: "Mathematical Calculation", desc: "Interpolation, geometry, circle, cylinder" },
        { id: "line_sizing", icon: "📏", name: "Line Sizing", desc: "Liquid, gas & multiphase flow" },
        { id: "equivalent_length", icon: "🔧", name: "Equivalent Length & Tables", desc: "Valves, fittings & API standards" },
        { id: "alarm_setting", icon: "⚠️", name: "Instrument Alarm Setting", desc: "Level settings, HH, H, L, LL" },
        { id: "psv_sizing", icon: "🔥", name: "PSV Sizing", desc: "Fire case, blocked discharge" },
        { id: "vessel_sizing", icon: "🏭", name: "Vessel Sizing", desc: "Vertical & horizontal vessels" },
        { id: "pump_sizing", icon: "🌀", name: "Pump Sizing", desc: "Pump duty, NPSH calculation" },
        { id: "heat_exchanger", icon: "🌡️", name: "Heat Exchanger Sizing", desc: "LMTD, heat duty" },
        { id: "compressor", icon: "⚙️", name: "Compressor Settle-out", desc: "Settle-out pressure & temperature" },
        { id: "reference", icon: "📚", name: "Reference", desc: "Pipe thickness, orifice areas, correction factors" }
    ];

    // Render main dashboard
    function renderDashboard() {
        return `
            <div class="header">
                <h1><span>🛠️</span> Process Engineer's Tool</h1>
                <p>Oil & Gas | Engineering Calculations Made Simple</p>
            </div>
            <div class="dashboard-grid">
                ${tools.map(tool => `
                    <div class="tool-card" onclick="selectTool('${tool.id}')">
                        <div class="tool-icon">${tool.icon}</div>
                        <div class="tool-title">${tool.name}</div>
                        <div class="tool-desc">${tool.desc}</div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    // Render Unit Converter with ALL outputs
    function renderUnitConverter() {
        const category = unitCategories[currentCategory];
        const isSpecial = category.isSpecial;
        const unitsList = category.displayOrder || Object.keys(category.units);
        
        // Calculate all conversions
        let conversions = {};
        if (isSpecial) {
            unitsList.forEach(toUnit => {
                conversions[toUnit] = category.convert(currentInputValue, currentCategory === "temperature" ? "°C" : unitsList[0], toUnit);
            });
        } else {
            const baseValue = currentInputValue / category.units[unitsList[0]];
            unitsList.forEach(unit => {
                conversions[unit] = baseValue * category.units[unit];
            });
        }

        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="converter-page">
                <h2 style="color: #0a2e5c; margin-bottom: 10px;">${category.name} Converter</h2>
                
                <div class="category-tabs">
                    ${Object.keys(unitCategories).map(catId => `
                        <button class="cat-tab ${catId === currentCategory ? 'active' : ''}" onclick="switchCategory('${catId}')">
                            ${unitCategories[catId].name}
                        </button>
                    `).join('')}
                </div>

                <div class="input-section">
                    <label class="input-label">Enter value in ${unitsList[0]}</label>
                    <input type="number" id="mainInput" class="value-input" value="${currentInputValue}" step="any" oninput="updateAllConversions(this.value)">
                </div>

                <div class="section-title">📊 All Conversion Results</div>
                <div class="results-grid">
                    ${unitsList.map(unit => `
                        <div class="result-card">
                            <div class="value">${conversions[unit].toFixed(6)}</div>
                            <div class="unit">${unit}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    // Placeholder for other tools (coming soon)
    function renderComingSoon(toolName) {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page coming-soon">
                <h2>🛠️ ${toolName}</h2>
                <p>This tool is under development. Coming soon!</p>
                <p style="margin-top: 20px; font-size: 0.9rem;">Based on your Excel data, this will include full calculations.</p>
            </div>
        `;
    }

    // Navigation functions
    window.selectTool = function(toolId) {
        currentView = toolId;
        renderApp();
    };

    window.goBack = function() {
        currentView = "dashboard";
        renderApp();
    };

    window.switchCategory = function(catId) {
        currentCategory = catId;
        renderApp();
    };

    window.updateAllConversions = function(value) {
        currentInputValue = parseFloat(value) || 0;
        renderApp();
    };

    // Main render function
    function renderApp() {
        const app = document.getElementById("app");
        
        if (currentView === "dashboard") {
            app.innerHTML = renderDashboard();
        } else if (currentView === "unit_converter") {
            app.innerHTML = renderUnitConverter();
            // Re-attach input listener after render
            const input = document.getElementById("mainInput");
            if (input) {
                input.value = currentInputValue;
            }
        } else {
            const tool = tools.find(t => t.id === currentView);
            app.innerHTML = renderComingSoon(tool ? tool.name : "Engineering Tool");
        }
    }

    // Initialize
    renderApp();
</script>
</body>
</html>
