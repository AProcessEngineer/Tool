<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google-site-verification" content="pLzoZiJTZLKHLwS9LkGWCiKIUB98ZtE8PqpDrAy6ASA" />
    <title>A Process Engineer's Tool - Oil & Gas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a2e5c 0%, #0a4c6e 100%);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; padding: 20px; }
        .header h1 { font-size: 2.5rem; color: white; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
        .header h1 span { color: #ff9800; }
        .header p { color: #b8d4f0; font-size: 1.5rem; font-weight: bold; margin-top: 10px; letter-spacing: 2px; }
        .footer-quote { text-align: center; margin-top: 50px; padding: 20px; border-top: 1px solid rgba(255,255,255,0.2); color: #ff9800; font-style: italic; font-size: 1.5rem; font-weight: 500; letter-spacing: 1px; }
        .copyright { text-align: center; font-size: 0.8rem; color: #888; margin-top: 10px; padding: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .tool-card {
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 28px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .tool-card:hover { transform: translateY(-8px); background: white; border-color: #ff9800; }
        .tool-icon { font-size: 3rem; margin-bottom: 15px; }
        .tool-title { font-size: 1.3rem; font-weight: 700; color: #0a2e5c; }
        .tool-desc { font-size: 0.85rem; color: #666; margin-top: 8px; }
        .back-btn {
            background: #ff9800; color: #1a2a3a; border: none; padding: 12px 24px;
            border-radius: 40px; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-bottom: 25px; display: inline-flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { background: #e68900; transform: translateX(-5px); }
        .converter-page, .tool-page { background: white; border-radius: 24px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .category-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; border-bottom: 2px solid #e0e0e0; padding-bottom: 15px; max-height: 280px; overflow-y: auto; }
        .cat-tab { background: #f0f4f8; border: none; padding: 6px 12px; border-radius: 30px; cursor: pointer; font-size: 0.7rem; transition: all 0.2s; white-space: nowrap; }
        .cat-tab.active { background: #0a2e5c; color: white; }
        .input-section { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; margin-bottom: 30px; align-items: end; }
        .input-group { flex: 1; }
        .input-label { font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 8px; display: block; }
        .value-input, .unit-select-input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; }
        .value-input:focus, .unit-select-input:focus { outline: none; border-color: #ff9800; }
        .swap-icon { font-size: 2rem; color: #ff9800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 25px; max-height: 500px; overflow-y: auto; padding-right: 10px; }
        .result-card { background: #f8f9fa; border-radius: 12px; padding: 12px; text-align: center; border-left: 4px solid #ff9800; }
        .result-card .value { font-size: 0.9rem; font-weight: 700; color: #0a2e5c; word-break: break-word; }
        .result-card .unit { font-size: 0.65rem; color: #888; margin-top: 5px; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: #0a2e5c; margin: 20px 0 15px 0; padding-bottom: 10px; border-bottom: 2px solid #ff9800; }
        .form-row { margin-bottom: 15px; }
        .form-row label { font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 5px; color: #333; }
        .form-row input, .form-row select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 10px; font-size: 0.9rem; }
        .btn-calc { background: #ff9800; border: none; padding: 12px 24px; border-radius: 40px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn-calc:hover { background: #e68900; }
        .result-box { background: #eef2ff; padding: 15px; border-radius: 12px; margin-top: 15px; border-left: 3px solid #ff9800; }
        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            .header p { font-size: 1.2rem; }
            .footer-quote { font-size: 1.2rem; }
            .input-section { grid-template-columns: 1fr; }
            .swap-icon { transform: rotate(90deg); padding: 10px 0; }
            .cat-tab { font-size: 0.6rem; padding: 4px 8px; }
            .results-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
    // Anti-copy protection
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c' || e.key === 'v' || e.key === 'i')) {
            e.preventDefault(); return false;
        }
        if (e.key === 'F12') { e.preventDefault(); return false; }
    });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
    console.log("%c🔒 A Process Engineer's Tool - Content Protected", "color: #ff9800; font-size: 16px; font-weight: bold;");

    function formatNumber(n) {
        if (isNaN(n) || n === null) return "0";
        if (n === 0) return "0";
        if (Math.abs(n) < 0.0001 && Math.abs(n) > 0) return n.toExponential(4);
        if (Math.abs(n) >= 1000000) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
        return parseFloat(n.toFixed(6)).toString();
    }

    // ==================== ALL 30+ UNIT CATEGORIES ====================
    const unitCategories = {
        length: { name: "📏 Length", units: { "meter":1, "kilometer":0.001, "centimeter":100, "millimeter":1000, "mile":0.000621371, "yard":1.09361, "foot":3.28084, "inch":39.3701 }, order: ["meter","kilometer","centimeter","millimeter","mile","yard","foot","inch"] },
        pressure_gauge: { name: "⚡ Pressure (Gauge)", units: { "bar g":1, "psi g":14.5038, "kPa g":100, "kg/cm² g":1.01972, "mmHg g":750.062, "mmH₂O g":10197.2 }, order: ["bar g","psi g","kPa g","kg/cm² g","mmHg g","mmH₂O g"] },
        pressure_absolute: { name: "⚡ Pressure (Absolute)", units: { "bar a":1, "psi a":14.5038, "kPa a":100, "kg/cm² a":1.01972, "mmHg a":750.062, "mmH₂O a":10197.2 }, order: ["bar a","psi a","kPa a","kg/cm² a","mmHg a","mmH₂O a"] },
        temperature: { name: "🌡️ Temperature", special: true, convert: (v,f,t)=>{ let c; if(f==="°C")c=v; else if(f==="°F")c=(v-32)*5/9; else if(f==="K")c=v-273.15; else if(f==="°R")c=(v-491.67)*5/9; else c=v; if(t==="°C")return c; if(t==="°F")return c*9/5+32; if(t==="K")return c+273.15; if(t==="°R")return(c+273.15)*9/5; return c; }, order: ["°C","°F","K","°R"] },
        temperature_interval: { name: "🌡️ Temp Interval", units: { "°C":1, "K":1, "°F":1.8, "°R":1.8 }, order: ["°C","K","°F","°R"] },
        volumetric_flow: { name: "💧 Volumetric Flow", units: { "m³/hr":1, "m³/day":24, "L/min":16.6667, "US GPM":4.4029, "BLPD":150.955, "ft³/hr":35.3147 }, order: ["m³/hr","m³/day","L/min","US GPM","BLPD","ft³/hr"] },
        mass_flow: { name: "⚖️ Mass Flow", units: { "kg/hr":1, "kg/s":0.00027778, "lb/hr":2.20462, "lb/s":0.0006124, "ton/hr":0.001 }, order: ["kg/hr","kg/s","lb/hr","lb/s","ton/hr"] },
        volume: { name: "🧴 Volume", units: { "m³":1, "liter":1000, "gallon":264.172, "barrel":6.2898, "ft³":35.3147 }, order: ["m³","liter","gallon","barrel","ft³"] },
        mass: { name: "⚖️ Mass", units: { "kg":1, "g":1000, "lb":2.20462, "ton":0.001 }, order: ["kg","g","lb","ton"] },
        density: { name: "🎯 Density", units: { "kg/m³":1, "g/cm³":0.001, "lb/ft³":0.06243, "SG":0.001 }, order: ["kg/m³","g/cm³","lb/ft³","SG"] },
        dynamic_viscosity: { name: "🔄 Dynamic Viscosity", units: { "cP":1000, "Pa·s":1, "N·s/m²":1, "kg/m·s":1, "lb/ft·s":0.672 }, order: ["cP","Pa·s","N·s/m²","kg/m·s","lb/ft·s"] },
        kinematic_viscosity: { name: "🌊 Kinematic Viscosity", units: { "m²/s":1, "cSt":1e6, "Stokes":10000, "cm²/s":10000, "ft²/s":10.7639 }, order: ["m²/s","cSt","Stokes","cm²/s","ft²/s"] },
        energy: { name: "⚡ Energy", units: { "Joule":1, "kJ":0.001, "Calorie":0.239, "kCal":0.000239, "BTU":0.0009478, "Wh":0.0002778, "kWh":2.7778e-7 }, order: ["Joule","kJ","Calorie","kCal","BTU","Wh","kWh"] },
        power: { name: "💪 Power", units: { "Watt":1, "kW":0.001, "MW":1e-6, "hp":0.001341, "BTU/hr":3.41214 }, order: ["Watt","kW","MW","hp","BTU/hr"] },
        area: { name: "📐 Area", units: { "m²":1, "cm²":10000, "ft²":10.7639, "in²":1550, "acre":0.0002471, "hectare":0.0001 }, order: ["m²","cm²","ft²","in²","acre","hectare"] },
        velocity: { name: "🏃 Velocity", units: { "m/s":1, "ft/s":3.28084, "km/h":3.6, "mph":2.23694, "knot":1.94384 }, order: ["m/s","ft/s","km/h","mph","knot"] },
        acceleration: { name: "📈 Acceleration", units: { "m/s²":1, "cm/s²":100, "ft/s²":3.28084, "G force":0.10197 }, order: ["m/s²","cm/s²","ft/s²","G force"] },
        specific_heat: { name: "🔥 Specific Heat", units: { "J/kg·K":1, "kJ/kg·K":0.001, "kcal/kg·°C":0.0002388, "Btu/lb·°F":0.0002388 }, order: ["J/kg·K","kJ/kg·K","kcal/kg·°C","Btu/lb·°F"] },
        thermal_conductivity: { name: "🌡️ Thermal Conductivity", units: { "W/m·K":1, "W/m·°C":1, "kcal/hr·m·°C":0.8598, "Btu/hr·ft·°F":0.5778 }, order: ["W/m·K","W/m·°C","kcal/hr·m·°C","Btu/hr·ft·°F"] },
        gas_constant: { name: "⚙️ Gas Constant", units: { "J/mol·K":1, "kJ/kmol·K":1, "Btu/lbmol·R":0.239, "lbf·ft/lbmol·R":185.86 }, order: ["J/mol·K","kJ/kmol·K","Btu/lbmol·R","lbf·ft/lbmol·R"] },
        molecular_weight: { name: "🧪 Molecular Weight", units: { "g/mol":1, "kg/kmol":1, "lb/lbmol":1 }, order: ["g/mol","kg/kmol","lb/lbmol"] },
        molar_flow: { name: "🔄 Molar Flowrate", units: { "kmol/hr":1, "kmol/s":0.0002778, "lbmol/hr":2.20462, "mol/s":0.27778 }, order: ["kmol/hr","kmol/s","lbmol/hr","mol/s"] },
        diffusivity: { name: "🌊 Diffusivity", units: { "m²/s":1, "cm²/s":10000, "ft²/s":10.7639 }, order: ["m²/s","cm²/s","ft²/s"] },
        electrical_conductivity: { name: "⚡ Electrical Conductivity", units: { "μS/cm":1, "mS/cm":0.001, "µmho/cm":1 }, order: ["μS/cm","mS/cm","µmho/cm"] },
        heat_flux: { name: "🔥 Heat Flux", units: { "W/m²":1, "kW/m²":0.001, "Btu/hr·ft²":0.316998 }, order: ["W/m²","kW/m²","Btu/hr·ft²"] },
        frequency: { name: "📊 Frequency", units: { "Hz":1, "RPM":60, "kHz":0.001, "1/min":60 }, order: ["Hz","RPM","kHz","1/min"] },
        angle: { name: "📐 Angle", units: { "degree":1, "radian":0.0174533, "π rad":0.005556 }, order: ["degree","radian","π rad"] },
        pressure_drop: { name: "📉 Pressure Drop", units: { "bar/100m":1, "psi/100ft":4.4209 }, order: ["bar/100m","psi/100ft"] },
        surface_tension: { name: "💧 Surface Tension", units: { "N/m":1, "dyne/cm":1000, "lbf/in":0.00571 }, order: ["N/m","dyne/cm","lbf/in"] },
        data_transfer: { name: "💾 Data Transfer", units: { "bps":1, "Kbps":0.001, "Mbps":1e-6, "Gbps":1e-9 }, order: ["bps","Kbps","Mbps","Gbps"] },
        momentum: { name: "💨 Momentum", units: { "kg·m/s":1, "lb·ft/s":7.2327 }, order: ["kg·m/s","lb·ft/s"] },
        time: { name: "⏱️ Time", units: { "seconds":1, "minutes":0.016667, "hours":0.00027778, "days":1.157e-5 }, order: ["seconds","minutes","hours","days"] },
        mole: { name: "🧪 Mole", units: { "mole":1, "kmol":0.001, "lbmol":0.002205 }, order: ["mole","kmol","lbmol"] }
    };

    let currentView = "dashboard";
    let currentCat = "length";
    let inputVal = 1;
    let fromUnit = "meter";
    let toUnit = "kilometer";

    // ==================== TOOLS DATA ====================
    const tools = [
        { id: "unit_converter", icon: "📐", name: "Unit Conversion", desc: "30+ engineering unit categories" },
        { id: "gas_phase", icon: "🔥", name: "Gas Phase", desc: "Ideal gas law, density, Z-factor" },
        { id: "line_sizing", icon: "📏", name: "Line Sizing", desc: "Single phase pressure drop" },
        { id: "pump_sizing", icon: "🌀", name: "Pump Sizing", desc: "Pump duty, NPSHa, Affinity laws" },
        { id: "psv_sizing", icon: "🛡️", name: "PSV Sizing", desc: "Fire case, blocked outlet" },
        { id: "receiver_sizing", icon: "🗄️", name: "Receiver Sizing", desc: "Air/Nitrogen receiver volume" },
        { id: "pressure_drop", icon: "📉", name: "Pressure Drop", desc: "Hooper 2K method" },
        { id: "heat_exchanger", icon: "🔥", name: "Heat Exchanger", desc: "LMTD, duty calculation" },
        { id: "flash_drum", icon: "💨", name: "Flash Drum", desc: "Vertical separator sizing" },
        { id: "compressible_flow", icon: "💨", name: "Compressible Flow", desc: "Gas flow calculations" }
    ];

    function renderDashboard() {
        return `
            <div class="header"><h1><span>🛠️</span> A Process Engineer's Tool</h1><p>Oil & Gas | Complete Engineering Suite</p></div>
            <div class="dashboard-grid">${tools.map(t => `<div class="tool-card" onclick="selectTool('${t.id}')"><div class="tool-icon">${t.icon}</div><div class="tool-title">${t.name}</div><div class="tool-desc">${t.desc}</div></div>`).join('')}</div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
            <div class="copyright">© 2026 A Process Engineer's Tool. All rights reserved.</div>
        `;
    }

    // ==================== UNIT CONVERTER ====================
    function getConversions() {
        const cat = unitCategories[currentCat];
        const list = cat.order;
        let conv = {};
        if (cat.special && cat.convert) {
            list.forEach(u => { conv[u] = cat.convert(inputVal, fromUnit, u); });
        } else {
            const base = inputVal / cat.units[fromUnit];
            list.forEach(u => { conv[u] = base * cat.units[u]; });
        }
        return conv;
    }

    function updateDisplay() {
        const cat = unitCategories[currentCat];
        const list = cat.order;
        const conv = getConversions();
        const preview = document.getElementById('previewResult');
        if (preview) preview.value = formatNumber(conv[toUnit]);
        list.forEach(unit => {
            const el = document.getElementById(`res_${unit.replace(/[^a-z0-9]/gi, '_')}`);
            if (el) el.innerHTML = formatNumber(conv[unit]);
        });
    }

    function renderUnitConverter() {
        const cat = unitCategories[currentCat];
        const list = cat.order;
        const conv = getConversions();
        
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="converter-page">
                <h2 style="color:#0a2e5c;">${cat.name} Converter <span style="font-size:0.8rem; color:#ff9800;">(30+ categories)</span></h2>
                <div class="category-tabs">
                    ${Object.keys(unitCategories).map(c => `<button class="cat-tab ${c===currentCat?'active':''}" onclick="switchCat('${c}')">${unitCategories[c].name}</button>`).join('')}
                </div>
                <div class="input-section">
                    <div class="input-group"><label class="input-label">From Value</label><input type="number" id="fromVal" class="value-input" value="${inputVal}" step="any" oninput="updateVal(this.value)"></div>
                    <div class="input-group"><label class="input-label">From Unit</label><select id="fromUnitSelect" class="unit-select-input" onchange="updateFrom(this.value)">${list.map(u => `<option ${u===fromUnit?'selected':''}>${u}</option>`).join('')}</select></div>
                    <div class="swap-icon" onclick="swapUnits()">⇅</div>
                    <div class="input-group"><label class="input-label">To Unit</label><select id="toUnitSelect" class="unit-select-input" onchange="updateTo(this.value)">${list.map(u => `<option ${u===toUnit?'selected':''}>${u}</option>`).join('')}</select></div>
                    <div class="input-group"><label class="input-label">Preview</label><input type="text" id="previewResult" class="value-input" value="${formatNumber(conv[toUnit])}" readonly style="background:#f5f5f5;"></div>
                </div>
                <div class="section-title">All Results (from ${fromUnit})</div>
                <div class="results-grid">
                    ${list.map(u => `<div class="result-card"><div class="value" id="res_${u.replace(/[^a-z0-9]/gi, '_')}">${formatNumber(conv[u])}</div><div class="unit">${u}</div></div>`).join('')}
                </div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
            <div class="copyright">© 2026 A Process Engineer's Tool. All rights reserved.</div>
        `;
    }

    // ==================== TOOL FUNCTIONS ====================
    function colebrook(epsD, Re) {
        let f = 0.02;
        for(let i=0;i<50;i++) {
            let fnew = 1 / Math.pow(-2 * Math.log10(epsD/3.7 + 2.51/(Re*Math.sqrt(f))), 2);
            if(Math.abs(fnew-f)<1e-8) return fnew;
            f=fnew;
        }
        return f;
    }

    function renderGasPhase() {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page">
                <h2 style="color:#0a2e5c;">🔥 Gas Phase Calculator</h2>
                <div class="form-row"><label>Pressure (bara)</label><input type="number" id="gas_p" class="form-control" value="1.013"></div>
                <div class="form-row"><label>Temperature (°C)</label><input type="number" id="gas_t" class="form-control" value="25"></div>
                <div class="form-row"><label>Molecular Weight (g/mol)</label><input type="number" id="gas_mw" class="form-control" value="29"></div>
                <div class="form-row"><label>Compressibility Factor (Z)</label><input type="number" id="gas_z" class="form-control" value="1"></div>
                <button class="btn-calc" onclick="calcGasPhase()">Calculate</button>
                <div id="gas_res" class="result-box">Click Calculate</div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
        `;
    }

    function calcGasPhase() {
        let P = parseFloat(document.getElementById('gas_p').value);
        let T = parseFloat(document.getElementById('gas_t').value) + 273.15;
        let MW = parseFloat(document.getElementById('gas_mw').value);
        let Z = parseFloat(document.getElementById('gas_z').value);
        let R = 8314;
        let rho = (P * 1e5 * MW) / (Z * R * T);
        document.getElementById('gas_res').innerHTML = `<strong>Density = ${rho.toFixed(3)} kg/m³</strong><br>Specific Gravity = ${(MW/29).toFixed(3)}`;
    }

    function renderLineSizing() {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page">
                <h2 style="color:#0a2e5c;">📏 Line Sizing - Single Phase</h2>
                <div class="form-row"><label>Pipe ID (mm)</label><input type="number" id="ls_dia" class="form-control" value="80"></div>
                <div class="form-row"><label>Length (m)</label><input type="number" id="ls_len" class="form-control" value="100"></div>
                <div class="form-row"><label>Flow Rate (m³/h)</label><input type="number" id="ls_q" class="form-control" value="100"></div>
                <div class="form-row"><label>Density (kg/m³)</label><input type="number" id="ls_rho" class="form-control" value="1000"></div>
                <div class="form-row"><label>Viscosity (cP)</label><input type="number" id="ls_mu" class="form-control" value="1"></div>
                <div class="form-row"><label>Roughness (mm)</label><input type="number" id="ls_eps" class="form-control" value="0.045"></div>
                <button class="btn-calc" onclick="calcLineSizing()">Calculate</button>
                <div id="ls_res" class="result-box">Click Calculate</div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
        `;
    }

    function calcLineSizing() {
        let D = parseFloat(document.getElementById('ls_dia').value)/1000;
        let L = parseFloat(document.getElementById('ls_len').value);
        let Q = parseFloat(document.getElementById('ls_q').value)/3600;
        let rho = parseFloat(document.getElementById('ls_rho').value);
        let mu = parseFloat(document.getElementById('ls_mu').value)/1000;
        let eps = parseFloat(document.getElementById('ls_eps').value)/1000;
        let A = Math.PI * D * D / 4;
        let V = Q / A;
        let Re = rho * V * D / mu;
        let f = colebrook(eps/D, Re);
        let dP = f * (L/D) * (rho * V * V / 2) / 1e5;
        document.getElementById('ls_res').innerHTML = `<strong>ΔP = ${dP.toFixed(2)} bar</strong><br>Velocity = ${V.toFixed(2)} m/s<br>Re = ${Re.toFixed(0)}<br>Friction Factor = ${f.toFixed(4)}`;
    }

    function renderPumpSizing() {

    function calcPumpSizingTool() {
        let Q = parseFloat(document.getElementById('pump_q').value)/3600;
        let rho = parseFloat(document.getElementById('pump_rho').value);
        let ps = parseFloat(document.getElementById('pump_ps').value) * 1e5;
        let pd = parseFloat(document.getElementById('pump_pd').value) * 1e5;
        let vp = parseFloat(document.getElementById('pump_vp').value) * 1e5;
        let eff = parseFloat(document.getElementById('pump_eff').value)/100;
        let dP = pd - ps;
        let power = (Q * dP) / (eff * 1000);
        let head = dP / (rho * 9.81);
        let npsha = (ps - vp) / 1e5;
        document.getElementById('pump_res').innerHTML = `<strong>Hydraulic Power = ${power.toFixed(1)} kW</strong><br>Head = ${head.toFixed(1)} m<br>NPSHa = ${npsha.toFixed(2)} bar`;
    }

    function renderPSVSizing() {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page">
                <h2 style="color:#0a2e5c;">🛡️ PSV Sizing - Fire Case</h2>
                <div class="form-row"><label>Wetted Area (m²)</label><input type="number" id="psv_area" class="form-control" value="50"></div>
                <div class="form-row"><label>Latent Heat (kJ/kg)</label><input type="number" id="psv_hv" class="form-control" value="300"></div>

    function calcPSVSizing() {
        let A = parseFloat(document.getElementById('psv_area').value);
        let Hv = parseFloat(document.getElementById('psv_hv').value);
        let Q = 43000 * Math.pow(A, 0.82);
        let W = Q / Hv;
        document.getElementById('psv_res').innerHTML = `<strong>Required Relief = ${W.toFixed(0)} kg/h</strong><br>API 521 Fire Case Formula`;
    }

    function renderReceiverSizing() {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page">
                <h2 style="color:#0a2e5c;">🗄️ Receiver Sizing</h2>
                <div class="form-row"><label>Sizing Basis</label>
                    <select id="rec_basis" class="form-control">
                        <option value="buffer">Hold Up Time (min)</option>
                        <option value="switch">Compressor Switching Frequency</option>
                    </select>
                </div>
                <div class="form-row"><label>Pressure Unload Pu (bara)</label><input type="number" id="rec_pu" class="form-control" value="8"></div>
                <div class="form-row"><label>Pressure Load Pl (bara)</label><input type="number" id="rec_pl" class="form-control" value="5"></div>
                <div class="form-row"><label>Demand Flow (Nm³/h)</label><input type="number" id="rec_qout" class="form-control" value="100"></div>
                <div class="form-row"><label id="rec_specific_label">Hold Up Time (min)</label><input type="number" id="rec_specific" class="form-control" value="5"></div>
                <div class="form-row"><label>Temperature (°C)</label><input type="number" id="rec_temp" class="form-control" value="55"></div>
                <div class="form-row"><label>Margin (%)</label><input type="number" id="rec_margin" class="form-control" value="20"></div>
                <button class="btn-calc" onclick="calcReceiverSizingTool()">Calculate</button>
                <div id="rec_res" class="result-box">Click Calculate</div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
        `;
    }

    function calcReceiverSizingTool() {
        let basis = document.getElementById('rec_basis').value;
        let Pu = parseFloat(document.getElementById('rec_pu').value);
        let Pl = parseFloat(document.getElementById('rec_pl').value);
        let Qout = parseFloat(document.getElementById('rec_qout').value);
        let specific = parseFloat(document.getElementById('rec_specific').value);
        let Temp = parseFloat(document.getElementById('rec_temp').value) + 273.15;
        let margin = parseFloat(document.getElementById('rec_margin').value)/100;
        let deltaP = Pu - Pl;
        let factor = 1.01325 / 293.15 * Temp / deltaP;
        let volume;
        if(basis === 'buffer') {
            volume = Qout * (specific / 60) * factor;
        } else {
            let Qin = specific;
            let chi = Qout / Qin;
            if(chi >= 1) { document.getElementById('rec_res').innerHTML = "Error: Demand > Supply"; return; }
            volume = (Qin * (1 - chi)) / (2 * 60) * factor;
        }
        let finalVol = volume * (1 + margin);
        document.getElementById('rec_res').innerHTML = `<strong>Receiver Volume = ${finalVol.toFixed(1)} m³</strong><br>${basis === 'buffer' ? 'Hold-up time basis' : 'Switching frequency basis'}`;
    }

    function renderPressureDrop() {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page">
                <h2 style="color:#0a2e5c;">📉 Hooper 2K Pressure Drop</h2>
                <div class="form-row"><label>Flow Rate (m³/h)</label><input type="number" id="h_q" class="form-control" value="100"></div>
                <div class="form-row"><label>Density (kg/m³)</label><input type="number" id="h_rho" class="form-control" value="1000"></div>
                <div class="form-row"><label>Viscosity (cP)</label><input type="number" id="h_mu" class="form-control" value="1"></div>
                <div class="form-row"><label>Pipe ID (mm)</label><input type="number" id="h_dia" class="form-control" value="102.3"></div>
                <div class="form-row"><label>Pipe Length (m)</label><input type="number" id="h_len" class="form-control" value="20"></div>
                <div class="form-row"><label>Roughness (mm)</label><input type="number" id="h_eps" class="form-control" value="0.045"></div>
                <div class="form-row"><label>Elbows (qty)</label><input type="number" id="h_elbows" class="form-control" value="2"></div>
                <button class="btn-calc" onclick="calcPressureDropTool()">Calculate</button>
                <div id="h_res" class="result-box">Click Calculate</div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
        `;
    }

    function calcPressureDropTool() {
        let Q = parseFloat(document.getElementById('h_q').value)/3600;
        let rho = parseFloat(document.getElementById('h_rho').value);
        let mu = parseFloat(document.getElementById('h_mu').value)/1000;
        let D = parseFloat(document.getElementById('h_dia').value)/1000;
        let L = parseFloat(document.getElementById('h_len').value);
        let eps = parseFloat(document.getElementById('h_eps').value)/1000;
        let elbows = parseFloat(document.getElementById('h_elbows').value) || 0;
        let A = Math.PI * D * D / 4;
        let V = Q / A;
        let Re = rho * V * D / mu;
        let f = colebrook(eps/D, Re);
        let K_pipe = f * L / D;
        let K_fittings = elbows * (800/Re + 0.4 * (1 + 0.5/Math.pow(D*1000, 0.3)));
        let K_total = K_pipe + K_fittings;
        let dP = K_total * (rho * V * V / 2) / 1e5;
        document.getElementById('h_res').innerHTML = `<strong>ΔP = ${dP.toFixed(2)} bar</strong><br>Velocity = ${V.toFixed(2)} m/s<br>Re = ${Re.toFixed(0)}<br>K_total = ${K_total.toFixed(2)}`;
    }

    function renderHeatExchanger() {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page">
                <h2 style="color:#0a2e5c;">🔥 Heat Exchanger - LMTD</h2>

                <div class="form-row"><label>Hot Outlet (°C)</label><input type="number" id="hx_th2" class="form-control" value="100"></div>
                <div class="form-row"><label>Cold Inlet (°C)</label><input type="number" id="hx_tc1" class="form-control" value="30"></div>
                <div class="form-row"><label>Cold Outlet (°C)</label><input type="number" id="hx_tc2" class="form-control" value="80"></div>
                <div class="form-row"><label>Heat Duty (kW)</label><input type="number" id="hx_q" class="form-control" value="1000"></div>
                <div class="form-row"><label>U Value (W/m²K)</label><input type="number" id="hx_u" class="form-control" value="500"></div>
                <button class="btn-calc" onclick="calcHeatExchangerTool()">Calculate</button>
                <div id="hx_res" class="result-box">Click Calculate</div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
        `;
    }

    function calcHeatExchangerTool() {
        let th1 = parseFloat(document.getElementById('hx_th1').value);
        let th2 = parseFloat(document.getElementById('hx_th2').value);
        let tc1 = parseFloat(document.getElementById('hx_tc1').value);
        let tc2 = parseFloat(document.getElementById('hx_tc2').value);
        let Q = parseFloat(document.getElementById('hx_q').value) * 1000;
        let U = parseFloat(document.getElementById('hx_u').value);
        let dT1 = th1 - tc2;
        let dT2 = th2 - tc1;
        let LMTD = (dT1 - dT2) / Math.log(dT1 / dT2);
        let area = Q / (U * LMTD);
        document.getElementById('hx_res').innerHTML = `<strong>LMTD = ${LMTD.toFixed(1)} °C</strong><br>Required Area = ${area.toFixed(1)} m²`;
    }

    function renderFlashDrum() {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page">
                <h2 style="color:#0a2e5c;">💨 Vertical Flash Drum</h2>
                <div class="form-row"><label>Vapor Flow (kg/h)</label><input type="number" id="fd_mv" class="form-control" value="5000"></div>
                <div class="form-row"><label>Vapor Density (kg/m³)</label><input type="number" id="fd_rhov" class="form-control" value="3.5"></div>
                <div class="form-row"><label>Liquid Density (kg/m³)</label><input type="number" id="fd_rhol" class="form-control" value="800"></div>
                <button class="btn-calc" onclick="calcFlashDrumTool()">Calculate</button>
                <div id="fd_res" class="result-box">Click Calculate</div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
        `;
    }

    function calcFlashDrumTool() {
        let mv = parseFloat(document.getElementById('fd_mv').value)/3600;
        let rhov = parseFloat(document.getElementById('fd_rhov').value);
        let rhol = parseFloat(document.getElementById('fd_rhol').value);
        let K = 0.107;
        let Vmax = K * Math.sqrt((rhol - rhov) / rhov);
        let area = mv / (rhov * Vmax);
        let D = Math.sqrt(area * 4 / Math.PI);
        document.getElementById('fd_res').innerHTML = `<strong>Diameter = ${D.toFixed(2)} m</strong><br>Length ≈ ${(D*3).toFixed(1)} m<br>Vapor Velocity = ${Vmax.toFixed(2)} m/s`;
    }

    function renderCompressibleFlow() {
        return `
            <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
            <div class="tool-page">
                <h2 style="color:#0a2e5c;">💨 Compressible Gas Flow</h2>
                <div class="form-row"><label>Upstream Pressure P1 (bara)</label><input type="number" id="cf_p1" class="form-control" value="7"></div>
                <div class="form-row"><label>Downstream Pressure P2 (bara)</label><input type="number" id="cf_p2" class="form-control" value="5"></div>
                <div class="form-row"><label>Temperature (°C)</label><input type="number" id="cf_t" class="form-control" value="25"></div>
                <div class="form-row"><label>MW (g/mol)</label><input type="number" id="cf_mw" class="form-control" value="29"></div>
                <div class="form-row"><label>Pipe ID (mm)</label><input type="number" id="cf_dia" class="form-control" value="50"></div>
                <div class="form-row"><label>Length (m)</label><input type="number" id="cf_len" class="form-control" value="50"></div>
                <button class="btn-calc" onclick="calcCompressibleFlowTool()">Calculate</button>
                <div id="cf_res" class="result-box">Click Calculate</div>
            </div>
            <div class="footer-quote">"Built by one. Scaled by intelligence"</div>
        `;
    }

    function calcCompressibleFlowTool() {
        let p1 = parseFloat(document.getElementById('cf_p1').value) * 1e5;
        let p2 = parseFloat(document.getElementById('cf_p2').value) * 1e5;
        let T = parseFloat(document.getElementById('cf_t').value) + 273.15;
        let MW = parseFloat(document.getElementById('cf_mw').value);
        let D = parseFloat(document.getElementById('cf_dia').value)/1000;
        let L = parseFloat(document.getElementById('cf_len').value);
        let R = 8314 / MW;
        let rho1 = p1 / (R * T);
        let A = Math.PI * D * D / 4;
        let f = 0.018;
        let dp = p1 - p2;
        let W = A * Math.sqrt((dp * rho1) / (f * L / D + 1));
        document.getElementById('cf_res').innerHTML = `<strong>Mass Flow = ${(W*3600).toFixed(0)} kg/h</strong><br>Density at P1 = ${rho1.toFixed(3)} kg/m³`;
    }

    // ==================== GLOBAL FUNCTIONS ====================
    window.updateVal = function(v) { inputVal = parseFloat(v) || 0; updateDisplay(); };
    window.updateFrom = function(u) { fromUnit = u; updateDisplay(); };
    window.updateTo = function(u) { toUnit = u; updateDisplay(); };
    window.swapUnits = function() { let t = fromUnit; fromUnit = toUnit; toUnit = t; document.getElementById('fromUnitSelect').value = fromUnit; document.getElementById('toUnitSelect').value = toUnit; updateDisplay(); };
    window.selectTool = function(id) { currentView = id; renderApp(); };
    window.goBack = function() { currentView = "dashboard"; renderApp(); };
    window.switchCat = function(cat) { currentCat = cat; const catObj = unitCategories[cat]; fromUnit = catObj.order[0]; toUnit = catObj.order[1] || catObj.order[0]; inputVal = 1; renderApp(); };

    function renderApp() {
        const app = document.getElementById("app");
        if (currentView === "dashboard") app.innerHTML = renderDashboard();
        else if (currentView === "unit_converter") app.innerHTML = renderUnitConverter();
        else if (currentView === "gas_phase") app.innerHTML = renderGasPhase();
        else if (currentView === "line_sizing") app.innerHTML = renderLineSizing();
        else if (currentView === "pump_sizing") app.innerHTML = renderPumpSizing();
        else if (currentView === "psv_sizing") app.innerHTML = renderPSVSizing();
        else if (currentView === "receiver_sizing") app.innerHTML = renderReceiverSizing();
        else if (currentView === "pressure_drop") app.innerHTML = renderPressureDrop();
        else if (currentView === "heat_exchanger") app.innerHTML = renderHeatExchanger();
        else if (currentView === "flash_drum") app.innerHTML = renderFlashDrum();
        else if (currentView === "compressible_flow") app.innerHTML = renderCompressibleFlow();
        else app.innerHTML = `<button class="back-btn" onclick="goBack()">← Back to Dashboard</button><div class="tool-page"><h2>Coming Soon</h2></div>`;
        
        if (currentView === "unit_converter") {
            setTimeout(() => {
                const inp = document.getElementById('fromVal');
                if (inp) inp.value = inputVal;
                updateDisplay();
            }, 50);
        }
        if (currentView === "receiver_sizing") {
            setTimeout(() => {
                const basis = document.getElementById('rec_basis');
                if(basis) {
                    basis.addEventListener('change', function() {
                        let label = document.getElementById('rec_specific_label');
                        let val = document.getElementById('rec_specific');
                        if(this.value === 'buffer') {
                            label.innerHTML = 'Hold Up Time (min)';
                            val.placeholder = '5';
                            val.value = '5';
                        } else {
                            label.innerHTML = 'Supply Flow Qin (Nm³/h)';
                            val.placeholder = '200';
                            val.value = '200';
                        }
                    });
                }
            }, 50);
        }
    }

    renderApp();
</script>
